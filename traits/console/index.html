<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Console animateur · Traits du leader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<style>
:root {
  --paper: #F2F4F7;
  --surface: #FFFFFF;
  --ink: #1B2230;
  --muted: #5E6878;
  --line: #DDE2E8;
  --line-strong: #C3CAD4;
  --accent: #12604F;
  --accent-hover: #0D4E40;
  --accent-ink: #FFFFFF;
  --accent-soft: #E0EEE9;
  --danger: #B3261E;
  --danger-soft: #FBEAE8;
  --warn: #85590A;
  --warn-soft: #FFF2D4;
  --shadow: 0 24px 64px rgba(16, 24, 40, .22);
  --font: 'Schibsted Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11151B; --surface: #181E26; --ink: #E6EAF0; --muted: #98A2B1; --line: #28303B; --line-strong: #39434F;
    --accent: #5BC2A5; --accent-hover: #7BD3BA; --accent-ink: #0B211B; --accent-soft: #1A352E;
    --danger: #F0857C; --danger-soft: #3A1E1C; --warn: #F2C46B; --warn-soft: #3A2E14;
    --shadow: 0 24px 64px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11151B; --surface: #181E26; --ink: #E6EAF0; --muted: #98A2B1; --line: #28303B; --line-strong: #39434F;
  --accent: #5BC2A5; --accent-hover: #7BD3BA; --accent-ink: #0B211B; --accent-soft: #1A352E;
  --danger: #F0857C; --danger-soft: #3A1E1C; --warn: #F2C46B; --warn-soft: #3A2E14;
  --shadow: 0 24px 64px rgba(0, 0, 0, .5); color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Structure ---------- */
.app { display: grid; grid-template-columns: 288px minmax(0, 1fr); min-height: 100%; }
.rail {
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 28px 16px 24px; display: flex; flex-direction: column; gap: 20px;
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
.brand svg { flex: none; }
.brand-title { font-weight: 700; font-size: 16px; line-height: 1.2; }
.brand-sub { font-size: 13px; color: var(--muted); }
.rail h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 4px 8px -8px; }
.u-list { display: flex; flex-direction: column; gap: 2px; }
.u-item {
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center;
  width: 100%; text-align: left; padding: 8px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
}
.u-item:hover { background: var(--paper); }
.u-item.is-active { background: var(--accent-soft); }
.u-item.is-active .u-item-name { color: var(--accent); }
.u-item-name { display: block; font-weight: 600; font-size: 14px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.u-item-meta { display: block; font-size: 12.5px; color: var(--muted); }
.rail-empty { font-size: 13.5px; color: var(--muted); padding: 0 8px; margin: 0; }

.main { padding: 44px 56px 64px; min-width: 0; }
.main-inner { max-width: 1040px; }
.demo-banner {
  background: var(--warn-soft); color: var(--warn); border-radius: 8px;
  padding: 10px 14px; font-size: 13.5px; margin-bottom: 28px; max-width: 1040px;
}

/* ---------- Sceau décagonal ---------- */
.seal-frame { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
.seal-ring { fill: none; stroke: var(--line); stroke-width: 1; }
.seal-shape { fill: var(--accent); stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; }
.seal-shape.is-empty { fill: none; stroke-dasharray: 3 3; }

/* ---------- En-tête d'univers ---------- */
.u-head { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 20px; align-items: center; }
.u-head h1 { font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -0.012em; margin: 0; overflow-wrap: anywhere; }
.u-head .meta { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.head-actions { display: flex; gap: 8px; }

.figures { display: flex; flex-wrap: wrap; gap: 12px 48px; margin: 28px 0 36px; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.figures div { min-width: 0; }
.figures dt { font-size: 13px; color: var(--muted); }
.figures dd { margin: 2px 0 0; font-size: 22px; font-weight: 600; line-height: 1.2; }
.figures dd small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; }

/* ---------- Participants ---------- */
.people-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.people-bar h2 { font-size: 18px; font-weight: 700; margin: 0 auto 0 0; }
.search { position: relative; width: min(300px, 100%); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { padding-left: 34px; }

.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 13px; font-weight: 500; color: var(--muted); text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 16px; border-bottom: 1px solid var(--line); font-size: 14.5px; vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
td.name .nom { font-weight: 700; letter-spacing: .01em; }
td.email { color: var(--muted); overflow-wrap: anywhere; }
th.r, td.r { text-align: right; }
td.act { width: 1%; padding: 6px 10px; }
.pill { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.dash { color: var(--line-strong); }
.no-match { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.foot-count { font-size: 13px; color: var(--muted); margin: 10px 2px 0; }

/* ---------- Zone d'import ---------- */
.drop {
  border: 1.5px dashed var(--line-strong); border-radius: 12px; background: var(--surface);
  padding: 48px 32px; text-align: center; transition: border-color .15s, background .15s;
}
.drop.is-over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { color: var(--accent); margin-bottom: 12px; }
.drop h3 { font-size: 18px; margin: 0 0 6px; }
.drop p { color: var(--muted); margin: 0 auto 20px; max-width: 46ch; font-size: 14.5px; }
.drop .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
.drop .formats { font-size: 13px; margin: 18px auto 0; }

/* ---------- État vide global ---------- */
.empty-all { max-width: 520px; padding-top: 48px; }
.empty-all h1 { font-size: 28px; line-height: 1.2; margin: 24px 0 10px; letter-spacing: -0.012em; }
.empty-all p { color: var(--muted); margin: 0 0 24px; }

/* ---------- Boutons et champs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; padding: 0 16px; border-radius: 7px; border: 1px solid transparent;
  font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); border-color: var(--line-strong); }
.btn-secondary:hover { background: var(--paper); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--paper); color: var(--ink); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger-ghost { background: transparent; color: var(--danger); }
.btn-danger-ghost:hover { background: var(--danger-soft); }
.btn-block { width: 100%; }
.btn-icon { width: 34px; height: 34px; padding: 0; color: var(--muted); background: transparent; }
.btn-icon:hover { color: var(--danger); background: var(--danger-soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.is-busy { cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.input, textarea {
  width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface);
}
textarea { height: 180px; padding: 10px 12px; resize: vertical; font-size: 13.5px; line-height: 1.45; }
.input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 .full { grid-column: 1 / -1; }
.hint { font-size: 13px; color: var(--muted); margin: -6px 0 0; }
.err { font-size: 13.5px; color: var(--danger); background: var(--danger-soft); padding: 8px 12px; border-radius: 7px; margin: 12px 0 0; }

/* ---------- Fenêtres ---------- */
dialog {
  border: 0; padding: 0; border-radius: 14px; background: var(--surface); color: var(--ink);
  width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); box-shadow: var(--shadow);
}
dialog.is-wide { width: min(820px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(15, 20, 30, .48); }
dialog[open] { animation: pop .16s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
.dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 48px); }
.dlg header { padding: 24px 24px 0; }
.dlg header h2 { font-size: 20px; line-height: 1.25; margin: 0; }
.dlg header p { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
.dlg-body { padding: 20px 24px; overflow-y: auto; }
.dlg footer { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--line); }
.dlg footer .left { margin-right: auto; }
.warn-box { background: var(--danger-soft); color: var(--ink); border-radius: 8px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px; }

/* ---------- Aperçu d'import ---------- */
.detect { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.detect b { color: var(--ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 11px; border-radius: 999px; }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.chip.skip { background: var(--paper); color: var(--muted); }
.preview { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.preview th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
.preview td { font-size: 13.5px; padding: 8px 14px; }
.preview tr.is-bad td { background: var(--danger-soft); }
.preview tr.is-skip td { color: var(--muted); }
.preview td.note { font-size: 12.5px; white-space: nowrap; }
.preview tr.is-bad td.note { color: var(--danger); font-weight: 600; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.mode { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line-strong); border-radius: 9px; padding: 12px; cursor: pointer; font-size: 14px; }
.mode:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.mode input { margin-top: 3px; accent-color: var(--accent); }
.mode b { display: block; }
.mode span { color: var(--muted); font-size: 13px; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px);
  background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 9px; font-size: 14px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 10; max-width: calc(100vw - 32px);
}
#toast.is-on { opacity: 1; transform: translate(-50%, 0); }
#toast.is-error { background: var(--danger); color: #fff; }

.loading { color: var(--muted); padding: 40px 0; }


/* ---------- Couleurs des séries ---------- */
:root { --c-auto: #2F55D4; --c-pairs: #D9822B; --c-group: #7A8494; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-auto: #8FA8FF; --c-pairs: #F2A65A; --c-group: #8A94A4; } }
:root[data-theme="dark"] { --c-auto: #8FA8FF; --c-pairs: #F2A65A; --c-group: #8A94A4; }

/* ---------- Chiffres avec action ---------- */
.figures .link { display: inline-block; margin-top: 4px; padding: 0; border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.figures .link:hover { color: var(--accent-hover); }
.figures .link:disabled { color: var(--muted); text-decoration: none; cursor: default; }

/* ---------- Tableau : sélection et statut ---------- */
td.chk, th.chk { width: 1%; padding-right: 0; }
input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; vertical-align: middle; margin: 0; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover td { background: var(--paper); }
tbody tr.row.is-sel td { background: var(--accent-soft); }
.status { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.status.open { color: var(--muted); font-weight: 500; padding-left: 0; }
.status.closed { background: var(--paper); color: var(--ink); border: 1px solid var(--line-strong); }
.status.sent { background: var(--accent-soft); color: var(--accent); }
.bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 10px 12px 10px 16px; margin-bottom: 12px; }
.bulk .count { font-size: 14px; font-weight: 600; margin-right: auto; }
.bulk .btn-secondary { background: transparent; color: var(--paper); border-color: rgba(255,255,255,.35); }
.bulk .btn-secondary:hover { background: rgba(255,255,255,.1); }
.bulk .btn-ghost { color: var(--paper); opacity: .8; }
.bulk .btn-ghost:hover { background: rgba(255,255,255,.1); color: var(--paper); opacity: 1; }
.bulk .btn-primary { background: var(--surface); color: var(--ink); }
.bulk .btn-primary:hover { background: var(--accent-soft); }

/* ---------- Fiche participant (panneau latéral) ---------- */
dialog.sheet { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(620px, 100vw); border-radius: 0; }
dialog.sheet[open] { animation: slide .2s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .dlg { height: 100%; max-height: 100dvh; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; padding-bottom: 4px; }
.sheet header h2 { font-size: 22px; }
.sheet .chips-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.x-btn { width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 22px; line-height: 1; }
.x-btn:hover { background: var(--paper); color: var(--ink); }
.radar { display: block; width: 100%; max-width: 520px; height: auto; margin: 0 auto; }
.radar .grid { fill: none; stroke: var(--line); stroke-width: 1; }
.radar .grid.outer { stroke: var(--line-strong); }
.radar .axis { stroke: var(--line); stroke-width: 1; }
.radar .lbl { font-size: 13px; fill: var(--ink); font-family: var(--font); }
.radar .tick { font-size: 10px; fill: var(--muted); font-family: var(--font); }
.radar .s-auto { fill: var(--c-auto); fill-opacity: .10; stroke: var(--c-auto); stroke-width: 2.2; stroke-linejoin: round; }
.radar .s-pairs { fill: var(--c-pairs); fill-opacity: .12; stroke: var(--c-pairs); stroke-width: 2.2; stroke-linejoin: round; }
.radar .s-group { fill: none; stroke: var(--c-group); stroke-width: 1.8; stroke-dasharray: 5 4; }
.radar .d-auto { fill: var(--c-auto); } .radar .d-pairs { fill: var(--c-pairs); }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--muted); margin: 4px 0 20px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid; vertical-align: middle; margin-right: 6px; }
.legend .l-auto i { border-color: var(--c-auto); } .legend .l-pairs i { border-color: var(--c-pairs); } .legend .l-group i { border-color: var(--c-group); border-top-style: dashed; }
.mini-kpi { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px; }
.mini-kpi div { padding: 10px 12px; border-left: 1px solid var(--line); }
.mini-kpi div:first-child { border-left: 0; }
.mini-kpi dt { font-size: 12.5px; color: var(--muted); }
.mini-kpi dd { margin: 0; font-size: 19px; font-weight: 700; }
.mini-kpi .v-auto { color: var(--c-auto); } .mini-kpi .v-pairs { color: var(--c-pairs); } .mini-kpi .v-group { color: var(--c-group); }
.profile { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 18px; font-size: 14px; color: var(--muted); }
.badge { font-size: 13px; font-weight: 700; padding: 3px 11px; border-radius: 999px; color: #fff; }
.badge.sur { background: #B3261E; } .badge.sous { background: #2F55D4; } .badge.accord_fav { background: #12604F; } .badge.accord_dev { background: #85590A; }
.sheet h3 { font-size: 15px; margin: 22px 0 8px; }
.tr-table td, .tr-table th { padding: 7px 10px; font-size: 13.5px; }
.tr-table th:not(:first-child), .tr-table td:not(:first-child) { text-align: right; }
.gap-up { color: var(--danger); font-weight: 700; } .gap-down { color: var(--c-auto); font-weight: 700; }
.johari { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.jz { border-radius: 9px; padding: 10px 12px; font-size: 13.5px; }
.jz b { display: block; font-size: 13px; margin-bottom: 4px; }
.jz span { color: var(--muted); }
.jz.ouverte { background: var(--accent-soft); } .jz.insoup { background: rgba(47,85,212,.10); } .jz.angle { background: var(--danger-soft); } .jz.dev { background: var(--warn-soft); }
.small-note { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
.empty-res { text-align: center; padding: 40px 12px; color: var(--muted); }
.empty-res h3 { color: var(--ink); margin: 0 0 6px; }

/* ---------- Envoi : progression ---------- */
.progress { height: 8px; background: var(--paper); border-radius: 999px; overflow: hidden; margin: 14px 0 8px; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.plan { list-style: none; padding: 0; margin: 0 0 14px; font-size: 14px; }
.plan li { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
.plan li:last-child { border-bottom: 0; }
.plan b { font-variant-numeric: tabular-nums; }
.inline-num { width: 64px; height: 32px; display: inline-block; margin: 0 4px; text-align: center; }
.check-line { display: flex; gap: 10px; align-items: center; font-size: 14px; margin: 8px 0; }
.info { background: var(--paper); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--muted); margin-top: 12px; }
.errlist { font-size: 13px; color: var(--danger); margin: 8px 0 0; padding-left: 18px; }


/* ---------- Tri du tableau ---------- */
.sort-btn { display: inline-flex; align-items: center; gap: 5px; padding: 2px 4px; margin: -2px -4px; border: 0; border-radius: 5px; background: none; font: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
.sort-btn:hover { color: var(--ink); background: var(--paper); }
.sort-btn.is-on { color: var(--ink); font-weight: 600; }
.sort-btn .arr { fill: currentColor; }
.sorts { display: inline-flex; gap: 12px; }
th.r .sort-btn { flex-direction: row-reverse; }


/* ---------- Connexion ---------- */
.login { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: grid; place-items: center; padding: 24px; overflow-y: auto; }
.login-card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px 28px; }
.login-card h1 { font-size: 22px; line-height: 1.25; margin: 18px 0 4px; }
.login-card > p { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
.login-card .btn-primary { width: 100%; margin-top: 6px; }
.login-card .check-line { margin: 4px 0 14px; color: var(--muted); font-size: 13.5px; }
.rail-foot { margin-top: auto; }


/* ---------- Invitation ---------- */
.code-tag { color: var(--ink); font-weight: 700; letter-spacing: .06em; }
.invite { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
.qr { background: #fff; padding: 12px; border-radius: 12px; border: 1px solid var(--line); width: 246px; height: 246px; }
.qr img, .qr canvas { display: block; width: 220px; height: 220px; }
.big-code { font-size: 64px; font-weight: 700; letter-spacing: .16em; line-height: 1.1; margin: 2px 0 16px; font-variant-numeric: tabular-nums; }
.invite-link { font-size: 14px; overflow-wrap: anywhere; margin: 2px 0 16px; }
.invite-actions { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 640px) { .invite { grid-template-columns: 1fr; justify-items: center; text-align: center; } .invite-actions { justify-content: center; } }


/* ---------- Accès des participants ---------- */
.access-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 8px 0 0; font-size: 13.5px; }
.access { font-weight: 600; padding: 2px 10px 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
.access::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.access.on { background: var(--accent-soft); color: var(--accent); }
.access.off { background: var(--paper); color: var(--muted); border: 1px solid var(--line-strong); }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.link-btn:disabled { color: var(--muted); cursor: progress; }
.access-warn { margin-bottom: 18px; }

/* ---------- Petits écrans ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 20px 16px; }
  .u-list { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .u-item { width: 220px; flex: none; }
  .main { padding: 28px 16px 48px; }
  .u-head { grid-template-columns: 56px minmax(0, 1fr); }
  .u-head .seal-big svg { width: 56px; height: 56px; }
  .head-actions { grid-column: 1 / -1; }
  .modes, .row3 { grid-template-columns: 1fr; }
  .mini-kpi { grid-template-columns: 1fr 1fr; }
  .mini-kpi div:nth-child(3) { border-left: 0; }
  .mini-kpi div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .johari { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .col-email { display: none; }
  .figures { gap: 12px 28px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<body>
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true"><polygon class="seal-frame" points="50,6 75.9,14.4 91.8,36.4 91.8,63.6 75.9,85.6 50,94 24.1,85.6 8.2,63.6 8.2,36.4 24.1,14.4"/><polygon class="seal-shape" points="50,24 68,25 78,41 70,58 62,72 50,70 35,74 28,58 30,41 38,31"/></svg>
    <h1>Console animateur</h1>
    <p>Questionnaire des traits du leader. Accès réservé à l’animateur.</p>
    <label class="field"><span>Mot de passe</span><input class="input" id="loginPw" type="password" autocomplete="current-password"></label>
    <label class="check-line"><input type="checkbox" id="loginRemember"><span>Rester connecté sur cet appareil</span></label>
    <p class="err" id="loginErr" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary" id="loginBtn">Se connecter</button>
  </form>
</div>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><polygon class="seal-frame" points="50,6 75.9,14.4 91.8,36.4 91.8,63.6 75.9,85.6 50,94 24.1,85.6 8.2,63.6 8.2,36.4 24.1,14.4"/><polygon class="seal-shape" points="50,24 68,25 78,41 70,58 62,72 50,70 35,74 28,58 30,41 38,31"/></svg>
      <div>
        <div class="brand-title">Traits du leader</div>
        <div class="brand-sub">Console animateur</div>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="btnNew" type="button">Nouvel univers</button>
    <h2 id="railTitle" hidden>Univers</h2>
    <nav class="u-list" id="uList" aria-labelledby="railTitle"></nav>
    <div class="rail-foot"><button type="button" class="btn btn-ghost btn-block" id="btnLogout" hidden>Se déconnecter</button></div>
  </aside>
  <main class="main" id="main" tabindex="-1">
    <div class="loading">Chargement…</div>
  </main>
</div>
<dialog id="dlg"></dialog>
<dialog id="sheet" class="sheet" aria-label="Fiche participant"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept=".csv,.txt,.xlsx,.xls,.ods" hidden>

<script>
(function () {
  'use strict';

  // ================= Connexion au serveur (ou mode démonstration) =================
  // Version GitHub : l'adresse du serveur est lue dans ../config.js (window.TRAITS_API_URL).
  var API_URL = typeof window.TRAITS_API_URL === 'string' ? window.TRAITS_API_URL : '';
  var MODE = (window.google && google.script && google.script.run) ? 'gas' : (API_URL ? 'http' : 'demo');
  var LIVE = MODE !== 'demo';
  var KEY = '';
  if (MODE === 'gas') { try { KEY = JSON.parse(document.getElementById('boot').textContent).key || ''; } catch (e) { KEY = ''; } }
  var STORE = 'traits_console_mdp';

  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (MODE === 'http') {
      return fetch(API_URL, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: fn, key: KEY, args: args })
      }).then(function (r) {
        if (!r.ok) throw new Error('Le serveur a répondu par une erreur (' + r.status + '). Réessayez dans un instant.');
        return r.json();
      }, function () {
        throw new Error('Impossible de joindre le serveur. Vérifiez votre connexion internet et l’adresse API_URL.');
      }).then(function (res) {
        if (res.ok) return res.data;
        var err = new Error(res.error || 'Erreur inconnue.');
        err.auth = !!res.auth;
        if (err.auth && fn !== 'login') authLost();
        throw err;
      });
    }
    return new Promise(function (resolve, reject) {
      if (MODE === 'gas') {
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
          reject(e instanceof Error ? e : new Error((e && e.message) || String(e)));
        });
        runner[fn].apply(runner, [KEY].concat(args));
      } else {
        Demo[fn].apply(null, args).then(resolve, reject);
      }
    });
  }

  // ================= Outils =================
  var $ = function (s, root) { return (root || document).querySelector(s); };
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function norm(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[_.]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function plural(n, word, pl) { return n + ' ' + (n > 1 ? (pl || word + 's') : word); }
  function fmtDate(iso, short) {
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString('fr-FR', short ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function f2(x) { return x == null ? '—' : x.toFixed(2).replace('.', ','); }
  function signed(x) { return x == null ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(2).replace('.', ','); }
  function fmtPrenom(s) {
    return String(s == null ? '' : s).trim().replace(/\s+/g, ' ').toLocaleLowerCase('fr')
      .replace(/(^|[\s\-'’])(\p{L})/gu, function (m, a, b) { return a + b.toLocaleUpperCase('fr'); });
  }
  function fmtNom(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' ').toLocaleUpperCase('fr'); }
  function fmtEmail(s) { return String(s == null ? '' : s).trim().toLowerCase().replace(/^mailto:/, ''); }
  function fullName(p) { return p.prenom + ' ' + p.nom; }

  // Sceau décagonal : 10 branches, une par trait, forme propre à chaque univers
  function seal(id, size, filled) {
    var h = 2166136261;
    for (var i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
    function rnd() { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; }
    function pts(radius) {
      var out = [];
      for (var k = 0; k < 10; k++) {
        var a = -Math.PI / 2 + k * Math.PI / 5, r = typeof radius === 'function' ? radius() : radius;
        out.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1));
      }
      return out.join(' ');
    }
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100" aria-hidden="true">' +
      '<polygon class="seal-frame" points="' + pts(44) + '"/>' +
      '<polygon class="seal-ring" points="' + pts(26) + '"/>' +
      '<polygon class="seal-shape' + (filled ? '' : ' is-empty') + '" points="' + pts(function () { return 17 + rnd() * 26; }) + '"/></svg>';
  }

  // Radar à 10 axes, échelle 1 à 5
  function radarSvg(labels, series) {
    var W = 540, H = 430, cx = W / 2, cy = 212, R = 148, n = labels.length;
    function xy(k, v) {
      var a = -Math.PI / 2 + k * 2 * Math.PI / n, r = R * (v - 1) / 4;
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    }
    function poly(vals) { return vals.map(function (v, k) { var p = xy(k, v); return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }
    var s = '<svg class="radar" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Radar des 10 traits">';
    for (var v = 2; v <= 5; v++) s += '<polygon class="grid' + (v === 5 ? ' outer' : '') + '" points="' + poly(labels.map(function () { return v; })) + '"/>';
    for (var k = 0; k < n; k++) { var e = xy(k, 5); s += '<line class="axis" x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '"/>'; }
    for (v = 2; v <= 5; v++) { var t = xy(0, v); s += '<text class="tick" x="' + (t[0] + 5) + '" y="' + (t[1] + 3.5) + '">' + v + '</text>'; }
    series.forEach(function (sr) {
      if (!sr.values) return;
      s += '<polygon class="' + sr.cls + '" points="' + poly(sr.values) + '"/>';
      if (sr.dots) sr.values.forEach(function (val, k) { var p = xy(k, val); s += '<circle class="' + sr.dots + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3"/>'; });
    });
    labels.forEach(function (lab, k) {
      var a = -Math.PI / 2 + k * 2 * Math.PI / n, c = Math.cos(a), sn = Math.sin(a);
      var x = cx + (R + 16) * c, y = cy + (R + 16) * sn;
      var anchor = c > 0.25 ? 'start' : (c < -0.25 ? 'end' : 'middle');
      var dy = sn > 0.5 ? 12 : (sn < -0.5 ? -4 : 4.5);
      s += '<text class="lbl" x="' + x.toFixed(1) + '" y="' + (y + dy).toFixed(1) + '" text-anchor="' + anchor + '">' + esc(lab) + '</text>';
    });
    return s + '</svg>';
  }

  var ICON = {
    upload: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="m7 9 5-5 5 5"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>',
    bigUpload: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 18v-6"/><path d="m9 14 3-3 3 3"/></svg>',
    search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    trash: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg>'
  };

  // ================= État =================
  var state = { universes: [], sel: null, participants: [], loadingP: false, q: '', imp: null, picked: {}, sheetPid: null, sending: false, sort: { key: 'nom', dir: 1 } };
  function current() { return state.universes.filter(function (u) { return u.id === state.sel; })[0] || null; }
  function byId(pid) { return state.participants.filter(function (p) { return p.id === pid; })[0] || null; }
  function pickedIds() { return Object.keys(state.picked).filter(function (id) { return state.picked[id] && byId(id); }); }

  // ================= Toast =================
  var toastTimer;
  function toast(msg, isError) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'is-on' + (isError ? ' is-error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ''; }, isError ? 5200 : 2800);
  }

  // ================= Chargement =================
  function loadUniverses(selectId) {
    return api('listUniverses').then(function (list) {
      state.universes = list;
      if (selectId) state.sel = selectId;
      if (!state.universes.some(function (u) { return u.id === state.sel; })) state.sel = list.length ? list[0].id : null;
      renderRail();
      return loadParticipants();
    }).catch(function (e) { $('#main').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  }

  function loadParticipants(quiet) {
    if (!state.sel) { state.participants = []; renderMain(); return Promise.resolve(); }
    if (!quiet) { state.loadingP = true; renderMain(); }
    var sel = state.sel;
    return api('getParticipants', sel).then(function (list) {
      if (sel !== state.sel) return;
      state.participants = list.sort(function (a, b) {
        return a.nom.localeCompare(b.nom, 'fr') || a.prenom.localeCompare(b.prenom, 'fr');
      });
      state.loadingP = false;
      renderMain();
    }).catch(function (e) { state.loadingP = false; toast(e.message, true); renderMain(); });
  }

  function refreshAll() {
    return api('listUniverses').then(function (list) {
      state.universes = list; renderRail();
      return loadParticipants(true);
    });
  }

  // ================= Rendu : barre latérale =================
  function renderRail() {
    var nav = $('#uList');
    $('#railTitle').hidden = !state.universes.length;
    if (!state.universes.length) { nav.innerHTML = '<p class="rail-empty">Aucun univers pour le moment.</p>'; return; }
    nav.innerHTML = state.universes.map(function (u) {
      var on = u.id === state.sel;
      return '<button type="button" class="u-item' + (on ? ' is-active' : '') + '" data-id="' + esc(u.id) + '"' + (on ? ' aria-current="true"' : '') + '>' +
        seal(u.id, 34, u.nParticipants > 0) +
        '<span><span class="u-item-name">' + esc(u.nom) + '</span><span class="u-item-meta">' + plural(u.nParticipants, 'participant') + '</span></span></button>';
    }).join('');
  }

  $('#uList').addEventListener('click', function (e) {
    var b = e.target.closest('.u-item');
    if (!b || b.dataset.id === state.sel) return;
    state.sel = b.dataset.id; state.q = ''; state.participants = []; state.picked = {};
    renderRail();
    loadParticipants();
    $('#main').focus({ preventScroll: true });
  });

  // ================= Rendu : zone principale =================
  function renderMain() {
    var main = $('#main');
    var banner = LIVE ? '' : '<div class="demo-banner">Mode démonstration : aperçu de l’interface avec des données fictives. Rien n’est enregistré et aucun email n’est envoyé.</div>';
    var u = current();
    if (!u) {
      main.innerHTML = banner + '<div class="empty-all">' + seal('bienvenue', 88, false) +
        '<h1>Créez un univers pour chaque groupe</h1>' +
        '<p>Un univers réunit une liste de participants, leurs évaluations et leurs rapports. Créez-en un par classe ou par session, et supprimez-le une fois l’exercice terminé.</p>' +
        '<button type="button" class="btn btn-primary" data-act="new">Créer un univers</button></div>';
      return;
    }
    var n = u.nParticipants, ps = state.participants;
    var loaded = !state.loadingP && ps.length;
    var nF = loaded ? ps.filter(function (p) { return p.ferme; }).length : u.nFermes;
    var nS = loaded ? ps.filter(function (p) { return p.envoye; }).length : u.nEnvoyes;
    var html = banner + '<div class="main-inner">' +
      '<section class="u-head"><div class="seal-big">' + seal(u.id, 76, n > 0) + '</div>' +
      '<div><h1>' + esc(u.nom) + '</h1><p class="meta">Créé le ' + fmtDate(u.cree) + (u.code ? '. Code participants : <b class="code-tag">' + esc(u.code) + '</b>' : '') + '</p>' +
      '<p class="access-line"><span class="access ' + (u.acces ? 'on' : 'off') + '">' + (u.acces ? 'Accès des participants ouvert' : 'Accès des participants fermé') + '</span>' +
      '<button type="button" class="link-btn" data-act="access">' + (u.acces ? 'Fermer l’accès' : 'Ouvrir l’accès') + '</button></p></div>' +
      '<div class="head-actions"><button type="button" class="btn btn-secondary" data-act="invite">Inviter les participants</button>' +
      '<button type="button" class="btn btn-ghost" data-act="rename">Renommer</button>' +
      '<button type="button" class="btn btn-danger-ghost" data-act="delete">Supprimer l’univers</button></div></section>' +
      '<dl class="figures">' +
      '<div><dt>Participants</dt><dd class="num">' + n + '</dd></div>' +
      '<div><dt>Auto-évaluations</dt><dd class="num">' + u.nAuto + (n ? '<small>sur ' + n + '</small>' : '') + '</dd></div>' +
      '<div><dt>Évaluations de pairs</dt><dd class="num">' + u.nPairs + '</dd></div>' +
      '<div><dt>Évaluations fermées</dt><dd class="num">' + nF + (n ? '<small>sur ' + n + '</small>' : '') + '</dd>' +
        (n ? (nF < n ? '<button type="button" class="link" data-act="close-all">Tout fermer</button>' : '<button type="button" class="link" data-act="open-all">Tout rouvrir</button>') : '') + '</div>' +
      '<div><dt>Rapports envoyés</dt><dd class="num">' + nS + (n ? '<small>sur ' + n + '</small>' : '') + '</dd>' +
        (n ? '<button type="button" class="link" data-act="send-all">Envoyer à tous</button>' : '') + '</div></dl>';

    if (state.loadingP) {
      html += '<p class="loading">Chargement des participants…</p>';
    } else if (!ps.length) {
      html += dropZoneHtml('main');
    } else {
      html += '<section><div class="people-bar"><h2>Participants</h2>' +
        '<label class="search">' + ICON.search + '<input class="input" id="q" type="search" placeholder="Rechercher un nom ou un email" aria-label="Rechercher un participant" value="' + esc(state.q) + '"></label>' +
        '<button type="button" class="btn btn-secondary" data-act="thr">Actions par seuil</button>' +
        '<button type="button" class="btn btn-secondary" data-act="add">Ajouter un participant</button>' +
        '<button type="button" class="btn btn-secondary" data-act="import">' + ICON.upload + 'Importer une liste</button></div>' +
        '<div id="bulkArea"></div><div id="tableArea"></div></section>';
    }
    html += '</div>';
    main.innerHTML = html;
    if (ps.length && !state.loadingP) renderTable();
    bindDrop($('.drop', main));
  }

  var SORTS = {
    prenom: { label: 'Prénom', text: true, get: function (p) { return p.prenom; } },
    nom: { label: 'Nom', text: true, get: function (p) { return p.nom; } },
    email: { label: 'Email', text: true, get: function (p) { return p.email; } },
    auto: { label: 'Auto-évaluation', get: function (p) { return p.auto ? 1 : 0; } },
    recues: { label: 'Évaluations reçues', get: function (p) { return p.recues; } },
    statut: { label: 'Évaluations', get: function (p) { return p.envoye ? 2 : (p.ferme ? 1 : 0); } }
  };
  function byName(a, b) { return a.nom.localeCompare(b.nom, 'fr') || a.prenom.localeCompare(b.prenom, 'fr'); }
  function visibleRows() {
    var q = norm(state.q), srt = state.sort, def = SORTS[srt.key];
    return state.participants.filter(function (p) { return !q || norm(p.prenom + ' ' + p.nom + ' ' + p.email).indexOf(q) !== -1; })
      .sort(function (a, b) {
        var va = def.get(a), vb = def.get(b);
        var c = def.text ? String(va).localeCompare(String(vb), 'fr', { sensitivity: 'base' }) : va - vb;
        return c * srt.dir || byName(a, b);
      });
  }
  function sortBtn(key) {
    var on = state.sort.key === key, d = SORTS[key];
    var arrow = on ? '<svg class="arr" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="' + (state.sort.dir > 0 ? 'M5 2 9 7H1z' : 'M5 8 1 3h8z') + '"/></svg>' : '';
    return '<button type="button" class="sort-btn' + (on ? ' is-on' : '') + '" data-sort="' + key + '" title="Trier par ' + d.label.toLowerCase() + '">' + d.label + arrow + '</button>';
  }
  function ariaSort(keys) {
    return keys.indexOf(state.sort.key) !== -1 ? ' aria-sort="' + (state.sort.dir > 0 ? 'ascending' : 'descending') + '"' : '';
  }

  function statusHtml(p) {
    if (p.envoye) return '<span class="status sent">Rapport envoyé le ' + fmtDate(p.dateEnvoi, true) + '</span>';
    if (p.ferme) return '<span class="status closed">Fermées</span>';
    return '<span class="status open">Ouvertes</span>';
  }

  function renderTable() {
    var rows = visibleRows(), q = state.q.trim();
    var allOn = rows.length && rows.every(function (p) { return state.picked[p.id]; });
    var someOn = rows.some(function (p) { return state.picked[p.id]; });
    var body = rows.map(function (p) {
      var on = !!state.picked[p.id];
      return '<tr class="row' + (on ? ' is-sel' : '') + '" data-pid="' + esc(p.id) + '">' +
        '<td class="chk"><input type="checkbox" data-pick="' + esc(p.id) + '"' + (on ? ' checked' : '') + ' aria-label="Sélectionner ' + esc(fullName(p)) + '"></td>' +
        '<td class="name">' + esc(p.prenom) + ' <span class="nom">' + esc(p.nom) + '</span></td>' +
        '<td class="email col-email">' + esc(p.email) + '</td>' +
        '<td>' + (p.auto ? '<span class="pill">Faite</span>' : '<span class="dash" aria-label="Non faite">—</span>') + '</td>' +
        '<td class="r num">' + p.recues + '</td>' +
        '<td>' + statusHtml(p) + '</td>' +
        '<td class="act"><button type="button" class="btn btn-icon" data-act="remove" data-id="' + esc(p.id) + '" aria-label="Retirer ' + esc(fullName(p)) + '" title="Retirer">' + ICON.trash + '</button></td></tr>';
    }).join('');
    $('#tableArea').innerHTML = '<div class="table-wrap"><table><thead><tr>' +
      '<th class="chk" scope="col"><input type="checkbox" id="pickAll"' + (allOn ? ' checked' : '') + ' aria-label="Tout sélectionner"></th>' +
      '<th scope="col"' + ariaSort(['prenom', 'nom']) + '><span class="sorts">' + sortBtn('prenom') + sortBtn('nom') + '</span></th>' +
      '<th scope="col" class="col-email"' + ariaSort(['email']) + '>' + sortBtn('email') + '</th>' +
      '<th scope="col"' + ariaSort(['auto']) + '>' + sortBtn('auto') + '</th>' +
      '<th scope="col" class="r"' + ariaSort(['recues']) + '>' + sortBtn('recues') + '</th>' +
      '<th scope="col"' + ariaSort(['statut']) + '>' + sortBtn('statut') + '</th><th scope="col"><span hidden>Actions</span></th></tr></thead>' +
      '<tbody>' + body + '</tbody></table>' +
      (rows.length ? '' : '<div class="no-match">Aucun participant ne correspond à « ' + esc(q) + ' ».</div>') + '</div>' +
      '<p class="foot-count">' + (q ? rows.length + ' sur ' + state.participants.length + ' participants' : plural(state.participants.length, 'participant')) +
      '. Cliquez sur un participant pour voir ses résultats.</p>';
    var pa = $('#pickAll');
    if (pa) pa.indeterminate = !allOn && someOn;
    renderBulk();
  }

  function renderBulk() {
    var ids = pickedIds(), area = $('#bulkArea');
    if (!area) return;
    if (!ids.length) { area.innerHTML = ''; return; }
    var all = ids.length === state.participants.length;
    area.innerHTML = '<div class="bulk" role="region" aria-label="Actions sur la sélection">' +
      '<span class="count">' + (all ? 'Tous les participants sélectionnés (' + ids.length + ')' : plural(ids.length, 'participant sélectionné', 'participants sélectionnés')) + '</span>' +
      '<button type="button" class="btn btn-primary" data-act="send-sel">Envoyer le rapport</button>' +
      '<button type="button" class="btn btn-secondary" data-act="close-sel">Fermer les évaluations</button>' +
      '<button type="button" class="btn btn-secondary" data-act="open-sel">Rouvrir les évaluations</button>' +
      '<button type="button" class="btn btn-ghost" data-act="clear-sel">Désélectionner</button></div>';
  }

  $('#main').addEventListener('input', function (e) {
    if (e.target.id === 'q') { state.q = e.target.value; renderTable(); }
  });

  $('#main').addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'pickAll') {
      visibleRows().forEach(function (p) { state.picked[p.id] = t.checked; });
      renderTable();
    } else if (t.dataset && t.dataset.pick) {
      state.picked[t.dataset.pick] = t.checked;
      renderTable();
    }
  });

  $('#main').addEventListener('click', function (e) {
    var sb = e.target.closest('[data-sort]');
    if (sb) {
      var k = sb.dataset.sort;
      if (state.sort.key === k) state.sort.dir = -state.sort.dir;
      else state.sort = { key: k, dir: SORTS[k].text ? 1 : -1 };
      renderTable();
      var again = $('[data-sort="' + k + '"]');
      if (again) again.focus();
      return;
    }
    var b = e.target.closest('[data-act]');
    if (b) {
      var act = b.dataset.act;
      if (act === 'new') nameDialog('create');
      else if (act === 'rename') nameDialog('rename', current());
      else if (act === 'delete') deleteDialog(current());
      else if (act === 'import') importDialog();
      else if (act === 'pick') pickFile();
      else if (act === 'paste') importDialog('paste');
      else if (act === 'add') addDialog();
      else if (act === 'remove') removeDialog(b.dataset.id);
      else if (act === 'clear-sel') { state.picked = {}; renderTable(); }
      else if (act === 'send-sel') sendDialog(pickedIds(), false);
      else if (act === 'send-all') sendDialog(state.participants.map(function (p) { return p.id; }), true);
      else if (act === 'close-sel') closeDialogFor(pickedIds(), true, false);
      else if (act === 'open-sel') closeDialogFor(pickedIds(), false, false);
      else if (act === 'close-all') closeDialogFor('ALL', true, true);
      else if (act === 'open-all') closeDialogFor('ALL', false, true);
      else if (act === 'thr') thresholdDialog();
      else if (act === 'invite') inviteDialog(current());
      else if (act === 'access') toggleAccess(current(), b);
      return;
    }
    if (e.target.closest('input, label, .chk')) return;
    var tr = e.target.closest('tr.row');
    if (tr) openSheet(tr.dataset.pid);
  });
  $('#btnNew').addEventListener('click', function () { nameDialog('create'); });

  // ================= Fenêtres : outils =================
  var dlg = $('#dlg');
  function openDialog(html, wide) {
    dlg.className = wide ? 'is-wide' : '';
    dlg.innerHTML = html;
    if (!dlg.open) dlg.showModal();
    var f = dlg.querySelector('[autofocus]');
    if (f) f.focus();
  }
  function closeDialog() { if (dlg.open) dlg.close(); }
  dlg.addEventListener('click', function (e) {
    if (state.sending) return;
    if (e.target.closest('[data-close]')) { e.preventDefault(); closeDialog(); }
    else if (e.target === dlg) closeDialog();
  });
  dlg.addEventListener('cancel', function (e) { if (state.sending) e.preventDefault(); });
  function busy(btn, on, label) {
    if (!btn) return;
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = label || 'Un instant…'; btn.disabled = true; btn.classList.add('is-busy'); }
    else { btn.textContent = btn.dataset.label || btn.textContent; btn.disabled = false; btn.classList.remove('is-busy'); }
  }
  function showErr(el, msg) { if (!el) { toast(msg, true); return; } el.textContent = msg; el.hidden = !msg; }

  // ================= Créer / renommer =================
  function nameDialog(mode, u) {
    var create = mode === 'create';
    openDialog('<form class="dlg" id="fName" novalidate><header><h2>' + (create ? 'Nouvel univers' : 'Renommer l’univers') + '</h2></header>' +
      '<div class="dlg-body"><label class="field"><span>Nom de l’univers</span>' +
      '<input class="input" id="inName" maxlength="80" autocomplete="off" autofocus value="' + (u ? esc(u.nom) : '') + '" placeholder="MSc Leadership, groupe A, septembre 2026"></label>' +
      '<p class="hint">Un nom qui permet de reconnaître le groupe et la session.</p><p class="err" id="errName" hidden></p></div>' +
      '<footer><button type="button" class="btn btn-secondary" data-close>Annuler</button>' +
      '<button type="submit" class="btn btn-primary">' + (create ? 'Créer l’univers' : 'Enregistrer le nom') + '</button></footer></form>');
    $('#fName').addEventListener('submit', function (e) {
      e.preventDefault();
      var nom = $('#inName').value.trim(), btn = $('#fName button[type=submit]');
      if (!nom) { showErr($('#errName'), 'Donnez un nom à l’univers.'); return; }
      busy(btn, true);
      var p = create ? api('createUniverse', nom) : api('renameUniverse', u.id, nom);
      p.then(function (res) {
        closeDialog();
        toast(create ? 'Univers créé' : 'Univers renommé');
        state.q = ''; state.picked = {};
        return loadUniverses(create ? res.id : u.id);
      }).catch(function (err) { busy(btn, false); showErr($('#errName'), err.message); });
    });
  }

  // ================= Supprimer un univers =================
  function deleteDialog(u) {
    var parts = [plural(u.nParticipants, 'participant')];
    if (u.nAuto) parts.push(plural(u.nAuto, 'auto-évaluation'));
    if (u.nPairs) parts.push(plural(u.nPairs, 'évaluation de pairs', 'évaluations de pairs'));
    if (u.nEnvoyes) parts.push(plural(u.nEnvoyes, 'rapport archivé', 'rapports archivés'));
    var what = parts.length > 1 ? parts.slice(0, -1).join(', ') + ' et ' + parts[parts.length - 1] : parts[0];
    openDialog('<form class="dlg" id="fDel" novalidate><header><h2>Supprimer « ' + esc(u.nom) + ' » ?</h2></header>' +
      '<div class="dlg-body"><div class="warn-box">L’univers et ses données (' + esc(what) + ') seront définitivement effacés. Les rapports archivés sont placés dans la corbeille de votre Drive. Cette action ne peut pas être annulée.</div>' +
      '<label class="field"><span>Pour confirmer, saisissez le nom de l’univers</span><input class="input" id="inDel" autocomplete="off" autofocus></label>' +
      '<p class="err" id="errDel" hidden></p></div>' +
      '<footer><button type="button" class="btn btn-secondary" data-close>Annuler</button>' +
      '<button type="submit" class="btn btn-danger" id="btnDel" disabled>Supprimer l’univers</button></footer></form>');
    $('#inDel').addEventListener('input', function (e) {
      $('#btnDel').disabled = e.target.value.trim().toLowerCase() !== u.nom.trim().toLowerCase();
    });
    $('#fDel').addEventListener('submit', function (e) {
      e.preventDefault();
      if ($('#btnDel').disabled) return;
      busy($('#btnDel'), true, 'Suppression…');
      api('deleteUniverse', u.id).then(function () {
        closeDialog();
        toast('Univers supprimé');
        state.sel = null; state.picked = {};
        return loadUniverses();
      }).catch(function (err) { busy($('#btnDel'), false); showErr($('#errDel'), err.message); });
    });
  }

  // ================= Ajouter / retirer un participant =================
  function addDialog() {
    openDialog('<form class="dlg" id="fAdd" novalidate><header><h2>Ajouter un participant</h2></header>' +
      '<div class="dlg-body"><div class="row3">' +
      '<label class="field"><span>Prénom</span><input class="input" id="aPrenom" autocomplete="off" autofocus></label>' +
      '<label class="field"><span>Nom</span><input class="input" id="aNom" autocomplete="off"></label>' +
      '<label class="field full"><span>Email</span><input class="input" id="aEmail" type="email" autocomplete="off" placeholder="prenom.nom@exemple.fr"></label></div>' +
      '<p class="err" id="errAdd" hidden></p></div>' +
      '<footer><button type="button" class="btn btn-secondary" data-close>Annuler</button><button type="submit" class="btn btn-primary">Ajouter le participant</button></footer></form>');
    $('#fAdd').addEventListener('submit', function (e) {
      e.preventDefault();
      var p = { prenom: $('#aPrenom').value, nom: $('#aNom').value, email: $('#aEmail').value };
      if (!p.prenom.trim() || !p.nom.trim()) { showErr($('#errAdd'), 'Renseignez le prénom et le nom.'); return; }
      if (!EMAIL_RE.test(fmtEmail(p.email))) { showErr($('#errAdd'), 'L’adresse email n’est pas valide.'); return; }
      var btn = $('#fAdd button[type=submit]');
      busy(btn, true);
      api('addParticipant', state.sel, p).then(function () {
        closeDialog();
        toast(fmtPrenom(p.prenom) + ' ' + fmtNom(p.nom) + ' ajouté(e)');
        return refreshAll();
      }).catch(function (err) { busy(btn, false); showErr($('#errAdd'), err.message); });
    });
  }

  function removeDialog(pid) {
    var p = byId(pid);
    if (!p) return;
    var data = p.auto || p.recues;
    openDialog('<form class="dlg" id="fRm"><header><h2>Retirer ' + esc(fullName(p)) + ' ?</h2>' +
      '<p>' + (data ? 'Son auto-évaluation et les évaluations qu’il ou elle a reçues seront aussi effacées.' : 'Cette personne sera retirée de la liste de l’univers.') + '</p></header>' +
      '<footer style="border-top:0"><button type="button" class="btn btn-secondary" data-close autofocus>Annuler</button><button type="submit" class="btn btn-danger">Retirer le participant</button></footer></form>');
    $('#fRm').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = $('#fRm button[type=submit]');
      busy(btn, true, 'Retrait…');
      api('removeParticipant', state.sel, pid).then(function () {
        closeDialog();
        delete state.picked[pid];
        toast(fullName(p) + ' retiré(e)');
        return refreshAll();
      }).catch(function (err) { busy(btn, false); toast(err.message, true); });
    });
  }

  // ================= Fermer / rouvrir les évaluations =================
  function closeDialogFor(pids, closing, all) {
    var n = all ? state.participants.length : pids.length;
    if (!n) return;
    var who = all ? 'de tous les participants (' + n + ')' : (n === 1 ? 'de ' + esc(fullName(byId(pids[0]))) : 'de ' + n + ' participants');
    var title = (closing ? 'Fermer' : 'Rouvrir') + ' les évaluations ' + who + ' ?';
    var body = closing
      ? 'Les personnes concernées ne pourront plus modifier leur auto-évaluation, et leurs pairs ne pourront plus les évaluer. Vous pourrez rouvrir à tout moment.'
      : 'Les personnes concernées pourront de nouveau modifier leur auto-évaluation et recevoir des évaluations. Un rapport déjà envoyé n’est pas mis à jour tant que vous ne le renvoyez pas.';
    openDialog('<form class="dlg" id="fClose"><header><h2>' + title + '</h2><p>' + body + '</p></header>' +
      '<footer style="border-top:0"><button type="button" class="btn btn-secondary" data-close>Annuler</button>' +
      '<button type="submit" class="btn btn-primary" autofocus>' + (closing ? 'Fermer les évaluations' : 'Rouvrir les évaluations') + '</button></footer></form>');
    $('#fClose').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = $('#fClose button[type=submit]');
      busy(btn, true);
      api('setClosed', state.sel, all ? 'ALL' : pids, closing).then(function (res) {
        closeDialog();
        toast((closing ? 'Évaluations fermées pour ' : 'Évaluations rouvertes pour ') + plural(res.n, 'participant'));
        if (!all) state.picked = {};
        return refreshAll().then(function () { if (state.sheetPid) openSheet(state.sheetPid, true); });
      }).catch(function (err) { busy(btn, false); toast(err.message, true); });
    });
  }

  // ================= Fiche participant =================
  var sheet = $('#sheet');
  sheet.addEventListener('click', function (e) {
    if (e.target === sheet || e.target.closest('[data-close-sheet]')) { sheet.close(); return; }
    var b = e.target.closest('[data-sact]');
    if (!b) return;
    var pid = state.sheetPid, p = byId(pid), act = b.dataset.sact;
    if (act === 'close') closeDialogFor([pid], true, false);
    else if (act === 'open') closeDialogFor([pid], false, false);
    else if (act === 'send') sendDialog([pid], false);
    else if (act === 'preview' || act === 'sent') {
      busy(b, true, act === 'preview' ? 'Génération…' : 'Ouverture…');
      api(act === 'preview' ? 'previewReport' : 'reportUrl', state.sel, pid).then(function (res) {
        busy(b, false);
        if (!res || !res.url) { toast('Dans la démonstration, les PDF ne sont pas générés.'); return; }
        var slot = $('#pdfLink', sheet);
        slot.innerHTML = '<a class="btn btn-secondary" target="_blank" rel="noopener" href="' + esc(res.url) + '">' +
          (act === 'preview' ? 'Ouvrir l’aperçu du rapport' : 'Ouvrir le rapport envoyé') + '</a>';
        slot.hidden = false;
      }).catch(function (err) { busy(b, false); toast(err.message, true); });
    }
  });
  sheet.addEventListener('close', function () { state.sheetPid = null; });

  function openSheet(pid, keep) {
    var p = byId(pid);
    if (!p) { if (sheet.open) sheet.close(); return; }
    state.sheetPid = pid;
    if (!keep || !sheet.open) {
      sheet.innerHTML = sheetShell(p, '<p class="loading">Chargement des résultats…</p>', '');
      if (!sheet.open) sheet.showModal();
    }
    api('getResults', state.sel, pid).then(function (r) {
      if (state.sheetPid !== pid) return;
      sheet.innerHTML = sheetShell(p, resultsHtml(p, r), sheetActions(p, r));
    }).catch(function (err) {
      sheet.innerHTML = sheetShell(p, '<div class="err">' + esc(err.message) + '</div>', '');
    });
  }

  function sheetShell(p, body, actions) {
    return '<div class="dlg"><header><div><h2>' + esc(p.prenom) + ' ' + esc(p.nom) + '</h2><p>' + esc(p.email) + '</p>' +
      '<div class="chips-line">' + statusHtml(p) + (p.auto ? '<span class="pill">Auto-évaluation faite</span>' : '') + '</div></div>' +
      '<button type="button" class="x-btn" data-close-sheet aria-label="Fermer la fiche">×</button></header>' +
      '<div class="dlg-body">' + body + '</div>' + (actions ? '<footer>' + actions + '</footer>' : '') + '</div>';
  }

  function sheetActions(p, r) {
    var a = '<span id="pdfLink" class="left" hidden></span>';
    a += p.ferme ? '<button type="button" class="btn btn-ghost" data-sact="open">Rouvrir les évaluations</button>'
                 : '<button type="button" class="btn btn-ghost" data-sact="close">Fermer les évaluations</button>';
    if (p.envoye && p.aRapport) a += '<button type="button" class="btn btn-secondary" data-sact="sent">Voir le rapport envoyé</button>';
    if (r.n || r.self) a += '<button type="button" class="btn btn-secondary" data-sact="preview">Aperçu du rapport</button>';
    if (r.n) a += '<button type="button" class="btn btn-primary" data-sact="send">' + (p.envoye ? 'Renvoyer le rapport' : 'Envoyer le rapport') + '</button>';
    return a;
  }

  function resultsHtml(p, r) {
    if (!r.n && !r.self) {
      return '<div class="empty-res"><h3>Pas encore de résultats</h3><p>Le radar apparaîtra dès que ' + esc(p.prenom) +
        ' aura fait son auto-évaluation ou reçu une première évaluation de ses pairs.</p></div>';
    }
    var h = radarSvg(r.traits, [
      { values: r.group, cls: 's-group' },
      { values: r.peer, cls: 's-pairs', dots: 'd-pairs' },
      { values: r.self, cls: 's-auto', dots: 'd-auto' }
    ]);
    h += '<div class="legend">' + (r.self ? '<span class="l-auto"><i></i>Auto-évaluation</span>' : '') +
      (r.peer ? '<span class="l-pairs"><i></i>Évaluation des pairs (' + r.n + ')</span>' : '') +
      (r.group ? '<span class="l-group"><i></i>Moyenne du groupe</span>' : '') + '</div>';
    h += '<dl class="mini-kpi"><div><dt>Auto</dt><dd class="num v-auto">' + f2(r.selfG) + '</dd></div>' +
      '<div><dt>Pairs</dt><dd class="num v-pairs">' + f2(r.peerG) + '</dd></div>' +
      '<div><dt>Groupe</dt><dd class="num v-group">' + f2(r.groupG) + '</dd></div>' +
      '<div><dt>Écart auto − pairs</dt><dd class="num">' + signed(r.D) + '</dd></div></dl>';
    if (r.type) h += '<p class="profile">Profil d’Atwater <span class="badge ' + r.type + '">' + esc(r.typeTitre) + '</span></p>';
    else if (!r.self) h += '<p class="profile">Sans auto-évaluation, le profil d’Atwater et la fenêtre de Johari ne peuvent pas être établis.</p>';
    else h += '<p class="profile">Aucune évaluation de pairs reçue pour l’instant.</p>';

    h += '<h3>Détail par trait</h3><div class="table-wrap"><table class="tr-table"><thead><tr><th>Trait</th><th>Auto</th><th>Pairs</th><th>Groupe</th><th>Écart</th></tr></thead><tbody>';
    r.traits.forEach(function (t, k) {
      var s = r.self ? r.self[k] : null, e = r.peer ? r.peer[k] : null, g = r.group ? r.group[k] : null;
      var d = (s != null && e != null) ? s - e : null;
      var cls = d == null ? '' : (d >= 0.75 ? 'gap-up' : (d <= -0.75 ? 'gap-down' : ''));
      h += '<tr><td>' + esc(t) + '</td><td class="num">' + f2(s) + '</td><td class="num">' + f2(e) + '</td><td class="num">' + f2(g) + '</td><td class="num ' + cls + '">' + signed(d) + '</td></tr>';
    });
    h += '</tbody></table></div><p class="small-note">En rouge : auto-évaluation supérieure d’au moins 0,75 point à celle des pairs ; en bleu : inférieure d’au moins 0,75 point.</p>';

    if (r.johari) {
      var zones = [['ouverte', 'Zone ouverte'], ['insoup', 'Forces insoupçonnées'], ['angle', 'Angle mort'], ['dev', 'Zone de développement']];
      h += '<h3>Fenêtre de Johari</h3><div class="johari">' + zones.map(function (z) {
        var items = r.johari[z[0]];
        return '<div class="jz ' + z[0] + '"><b>' + z[1] + '</b>' + (items.length ? esc(items.join(', ')) : '<span>Aucun trait</span>') + '</div>';
      }).join('') + '</div><p class="small-note">Référence : ' + esc(r.reference) + '. Résultats calculés en direct sur les ' + r.nGroupe + ' participants évalués.</p>';
    }
    return h;
  }

  // ================= Envoi des rapports =================
  function sendDialog(pids, all) {
    if (!pids.length) return;
    state.send = { pids: pids, all: all, useThr: false, thr: 3, resend: false };
    renderSendPlan();
  }

  function sendPlan() {
    var s = state.send, go = [], none = [], thr = [], sent = [], noAuto = 0;
    s.pids.forEach(function (id) {
      var p = byId(id);
      if (!p) return;
      if (!p.recues) none.push(p);
      else if (s.useThr && p.recues < s.thr) thr.push(p);
      else if (p.envoye && !s.resend) sent.push(p);
      else { go.push(p); if (!p.auto) noAuto++; }
    });
    return { go: go, none: none, thr: thr, sent: sent, noAuto: noAuto };
  }

  function renderSendPlan() {

  function runSend(ids, formSel, intro) {
    formSel = formSel || '#fSend';
    var total = ids.length, done = 0, ok = 0, fails = [], BATCH = 3;
    state.sending = true;
    var body = $(formSel + ' .dlg-body'), foot = $(formSel + ' footer');
    foot.innerHTML = '<button type="button" class="btn btn-primary" disabled>Envoi en cours…</button>';
    function paint() {
      body.innerHTML = (intro ? '<p class="small-note" style="margin-top:0">' + intro + '</p>' : '') + '<p><b class="num">' + done + '</b> sur ' + total + ' traités</p><div class="progress"><div style="width:' + Math.round(done / total * 100) + '%"></div></div>' +
        '<p class="small-note">Gardez cette fenêtre ouverte jusqu’à la fin de l’envoi.</p>' +
        (fails.length ? '<ul class="errlist">' + fails.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>' : '');
    }
    function finish(fatal) {
      state.sending = false;
      paint();
      var summary = plural(ok, 'rapport envoyé', 'rapports envoyés') + (fails.length ? ', ' + plural(fails.length, 'échec') : '') + '.';
      body.insertAdjacentHTML('afterbegin', '<p style="font-size:16px;font-weight:600;margin-top:0">' + (fatal ? 'Envoi interrompu. ' : 'Envoi terminé. ') + summary + '</p>');
      if (fatal) body.insertAdjacentHTML('beforeend', '<p class="err">' + esc(fatal) + '</p>');
      foot.innerHTML = '<button type="button" class="btn btn-primary" data-close>Fermer</button>';
      if (ok) toast(summary, !!fails.length);
      state.picked = {};
      refreshAll().then(function () { if (state.sheetPid) openSheet(state.sheetPid, true); });
    }
    function next() {
      if (done >= total) return finish();
      var batch = ids.slice(done, done + BATCH);
      api('sendReports', state.sel, batch, { resend: true }).then(function (res) {
        res.forEach(function (x) {
          if (x.ok) ok++; else fails.push((x.nom || x.pid) + ' : ' + x.reason);
        });
        done += batch.length;
        paint();
        next();
      }).catch(function (err) { finish(err.message); });
    }
    paint();
    next();
  }

  // ================= Import : lecture des fichiers =================
  function parseDelimited(text) {
    text = String(text).replace(/^\uFEFF/, '');
    var first = (text.split(/\r?\n/).filter(function (l) { return l.trim(); })[0]) || '';
    var delim = ['\t', ';', ','].reduce(function (best, d) { return first.split(d).length > first.split(best).length ? d : best; }, '\t');
    var rows = [], row = [], cell = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"' && cell === '') q = true;
      else if (c === delim) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ''; }); });
  }

  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = res;
      s.onerror = function () { rej(new Error('Le lecteur de fichiers Excel n’a pas pu se charger. Enregistrez la liste au format CSV, ou copiez-collez les colonnes depuis Excel.')); };
      document.head.appendChild(s);
    });
  }

  function readFile(file) {
    var name = file.name.toLowerCase();
    return file.arrayBuffer().then(function (buf) {
      if (/\.(xlsx|xls|ods)$/.test(name)) {
        return loadXlsx().then(function () {
          var wb = XLSX.read(buf, { type: 'array' });
          var ws = wb.Sheets[wb.SheetNames[0]];
          return XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false })
            .filter(function (r) { return r.some(function (x) { return String(x).trim() !== ''; }); });
        });
      }
      var text;
      try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
      catch (e) { text = new TextDecoder('windows-1252').decode(buf); }
      return parseDelimited(text);
    });
  }

  // ================= Import : reconnaissance des colonnes =================
  var HEAD = {
    prenom: ['prenom', 'prenoms', 'first name', 'firstname', 'given name'],
    nom: ['nom', 'nom de famille', 'last name', 'lastname', 'surname', 'family name'],
    email: ['email', 'e-mail', 'mail', 'courriel', 'adresse mail', 'adresse e-mail', 'adresse email', 'email address', 'e-mail address', 'adresse electronique'],
    complet: ['nom complet', 'nom prenom', 'prenom nom', 'nom et prenom', 'prenom et nom', 'full name', 'name', 'etudiant', 'etudiante', 'participant', 'participante', 'identite', 'apprenant']
  };

  function detectColumns(rows) {
    if (!rows.length) return null;
    var head = rows[0].map(norm), map = {};
    head.forEach(function (h, i) {
      Object.keys(HEAD).forEach(function (k) { if (map[k] == null && HEAD[k].indexOf(h) !== -1) map[k] = i; });
    });
    if (map.email == null) head.forEach(function (h, i) { if (map.email == null && /mail|courriel/.test(h)) map.email = i; });
    var hasHeader = map.email != null && (map.prenom != null || map.nom != null || map.complet != null);
    if (hasHeader) {
      if (map.prenom != null && map.nom != null) return { hasHeader: true, prenom: map.prenom, nom: map.nom, email: map.email, headers: rows[0] };
      var full = map.complet != null ? map.complet : (map.nom != null ? map.nom : map.prenom);
      return { hasHeader: true, complet: full, email: map.email, headers: rows[0] };
    }
    var sample = rows.slice(0, 15), width = Math.max.apply(null, rows.map(function (r) { return r.length; }));
    var best = -1, bestScore = 0;
    for (var c = 0; c < width; c++) {
      var score = sample.filter(function (r) { return EMAIL_RE.test(fmtEmail(r[c])); }).length;
      if (score > bestScore) { bestScore = score; best = c; }
    }
    if (best < 0) return null;
    var firstIsHeader = !EMAIL_RE.test(fmtEmail(rows[0][best]));
    var others = [];
    for (var j = 0; j < width; j++) {
      if (j !== best && sample.some(function (r) { return String(r[j] || '').trim() !== ''; })) others.push(j);
    }
    if (others.length >= 2) return { hasHeader: firstIsHeader, prenom: others[0], nom: others[1], email: best, guessed: true };
    if (others.length === 1) return { hasHeader: firstIsHeader, complet: others[0], email: best, guessed: true };
    return null;
  }

  function splitFull(s) {
    s = String(s || '').trim().replace(/\s+/g, ' ');
    if (!s) return ['', ''];
    if (s.indexOf(',') !== -1) { var c = s.split(','); return [c.slice(1).join(' ').trim(), c[0].trim()]; }
    var tokens = s.split(' ');
    var isUpper = function (t) { return t.length > 1 && /\p{Lu}/u.test(t) && t === t.toLocaleUpperCase('fr'); };
    var up = tokens.filter(isUpper);
    if (up.length && up.length < tokens.length) {
      return [tokens.filter(function (t) { return !isUpper(t); }).join(' '), up.join(' ')];
    }
    return [tokens[0], tokens.slice(1).join(' ')];
  }

  function buildRows() {
    var imp = state.imp, det = imp.det;
    var data = det.hasHeader ? imp.raw.slice(1) : imp.raw;
    var existing = {};
    state.participants.forEach(function (p) { existing[p.email] = true; });
    var seen = {};
    return data.map(function (r) {
      var prenom, nom;
      if (det.complet != null) { var sp = splitFull(r[det.complet]); prenom = sp[0]; nom = sp[1]; }
      else { prenom = r[det.prenom]; nom = r[det.nom]; }
      if (imp.swap) { var t = prenom; prenom = nom; nom = t; }
      var o = { prenom: fmtPrenom(prenom), nom: fmtNom(nom), email: fmtEmail(r[det.email]) };
      if (!o.prenom || !o.nom) o.bad = 'Prénom ou nom manquant';
      else if (!o.email) o.bad = 'Email manquant';
      else if (!EMAIL_RE.test(o.email)) o.bad = 'Email invalide';
      else if (seen[o.email]) o.bad = 'En double dans la liste';
      else if (imp.mode === 'append' && existing[o.email]) o.skip = 'Déjà inscrit(e)';
      seen[o.email] = true;
      return o;
    });
  }

  function bindDrop(zone) {
