    });
  }

  function pickFile() { var fi = $('#fileInput'); fi.value = ''; fi.click(); }
  $('#fileInput').addEventListener('change', function (e) { if (e.target.files[0]) handleFile(e.target.files[0]); });

  function importDialog(view) {
    state.imp = newImp();
    if (view === 'paste') return pasteDialog();
    openDialog('<div class="dlg"><header><h2>Importer une liste</h2><p>Dans « ' + esc(current().nom) + ' »</p></header>' +
      '<div class="dlg-body">' + dropZoneHtml('dialog') + '<p class="err" id="errImp" hidden></p></div>' +
      '<footer><button type="button" class="btn btn-secondary" data-close>Annuler</button></footer></div>', true);
    bindDrop($('.drop', dlg));
    dlg.querySelector('[data-act="pick"]').addEventListener('click', pickFile);
    dlg.querySelector('[data-act="paste"]').addEventListener('click', function () { pasteDialog(); });
  }

  function pasteDialog() {
    if (!state.imp) state.imp = newImp();
    openDialog('<form class="dlg" id="fPaste" novalidate><header><h2>Coller depuis Excel</h2>' +
      '<p>Sélectionnez les colonnes Prénom, Nom et Email dans Excel (avec ou sans la ligne de titres), copiez-les, puis collez-les ci-dessous.</p></header>' +
      '<div class="dlg-body"><textarea id="taPaste" autofocus spellcheck="false" placeholder="Prénom&#9;Nom&#9;Email&#10;Léa&#9;Martin&#9;lea.martin@exemple.fr"></textarea>' +
      '<p class="err" id="errImp" hidden></p></div>' +
      '<footer><button type="button" class="btn btn-secondary" data-close>Annuler</button><button type="submit" class="btn btn-primary">Vérifier la liste</button></footer></form>', true);
    $('#fPaste').addEventListener('submit', function (e) {
      e.preventDefault();
      var text = $('#taPaste').value;
      if (!text.trim()) { showErr($('#errImp'), 'Collez d’abord les colonnes copiées depuis Excel.'); return; }
      analyse(parseDelimited(text), 'Texte collé');
    });
  }

  function handleFile(file) {
    if (!state.imp) state.imp = newImp();
    if (!/\.(xlsx|xls|ods|csv|txt)$/i.test(file.name)) {
      failImport('Ce type de fichier n’est pas pris en charge. Utilisez un fichier .xlsx, .xls ou .csv.');
      return;
    }
    readFile(file).then(function (rows) { analyse(rows, file.name); })
      .catch(function (e) { failImport(e.message || 'Le fichier n’a pas pu être lu.'); });
  }

  function failImport(msg) {
    var el = dlg.open && $('#errImp', dlg);
    if (el) showErr(el, msg); else toast(msg, true);
  }

  function analyse(rows, source) {
    if (!state.imp) state.imp = newImp();
    if (!rows.length) return failImport('La liste est vide.');
    var det = detectColumns(rows);
    if (!det) return failImport('Aucune colonne d’adresses email n’a été trouvée. Vérifiez que la liste contient le prénom, le nom et l’email de chaque participant.');
    state.imp.raw = rows; state.imp.det = det; state.imp.source = source;
    renderPreview();
  }

  function renderPreview() {
    var imp = state.imp, det = imp.det, rows = buildRows();
    var ok = rows.filter(function (r) { return !r.bad && !r.skip; });
    var bad = rows.filter(function (r) { return r.bad; }).length;
    var skip = rows.filter(function (r) { return r.skip; }).length;
    var hasList = state.participants.length > 0;
    var colsTxt = det.complet != null ? 'Nom complet découpé en prénom et nom, et email' : 'Prénom, nom et email';
    var source = det.hasHeader && det.headers ?
      ' (colonnes « ' + (det.complet != null ? esc(det.headers[det.complet]) : esc(det.headers[det.prenom]) + ' », « ' + esc(det.headers[det.nom])) + ' » et « ' + esc(det.headers[det.email]) + ' »)' : '';
    var list = rows.slice(0, 500).map(function (r) {
      var cls = r.bad ? 'is-bad' : (r.skip ? 'is-skip' : '');
      return '<tr class="' + cls + '"><td>' + esc(r.prenom) + ' <b>' + esc(r.nom) + '</b></td><td class="col-email">' + esc(r.email) + '</td>' +
        '<td class="note">' + esc(r.bad || r.skip || '') + '</td></tr>';
    }).join('');

    openDialog('<div class="dlg"><header><h2>Vérifier la liste avant l’import</h2>' +
      '<p>' + esc(imp.source) + ' dans « ' + esc(current().nom) + ' »</p></header><div class="dlg-body">' +
      '<div class="detect"><span>Colonnes reconnues : <b>' + colsTxt + '</b>' + source + '.</span>' +
      '<button type="button" class="btn btn-ghost" id="btnSwap">Inverser prénom et nom</button></div>' +
      '<div class="chips"><span class="chip ok">' + plural(ok.length, 'participant prêt', 'participants prêts') + '</span>' +
      (bad ? '<span class="chip bad">' + plural(bad, 'ligne à corriger', 'lignes à corriger') + ', ignorée' + (bad > 1 ? 's' : '') + '</span>' : '') +
      (skip ? '<span class="chip skip">' + plural(skip, 'personne déjà inscrite', 'personnes déjà inscrites') + ', ignorée' + (skip > 1 ? 's' : '') + '</span>' : '') + '</div>' +
      '<div class="preview"><table><thead><tr><th>Participant</th><th class="col-email">Email</th><th>Remarque</th></tr></thead><tbody>' + list + '</tbody></table></div>' +
      (hasList ? '<div class="modes" role="radiogroup" aria-label="Mode d’import">' +
        '<label class="mode"><input type="radio" name="mode" value="append"' + (imp.mode === 'append' ? ' checked' : '') + '><span><b>Ajouter à la liste actuelle</b><span>Les ' + state.participants.length + ' participants actuels sont conservés.</span></span></label>' +
        '<label class="mode"><input type="radio" name="mode" value="replace"' + (imp.mode === 'replace' ? ' checked' : '') + '><span><b>Remplacer la liste actuelle</b><span>Les participants actuels, leurs évaluations et leurs rapports seront effacés.</span></span></label></div>' : '') +
      '<p class="err" id="errImp" hidden></p></div>' +
      '<footer><button type="button" class="btn btn-ghost left" id="btnOther">Choisir une autre liste</button>' +
      '<button type="button" class="btn btn-secondary" data-close>Annuler</button>' +
      '<button type="button" class="btn ' + (imp.mode === 'replace' ? 'btn-danger' : 'btn-primary') + '" id="btnDoImport"' + (ok.length ? '' : ' disabled') + '>' +
      (imp.mode === 'replace' ? 'Remplacer par ' : 'Importer ') + plural(ok.length, 'participant') + '</button></footer></div>', true);

    $('#btnSwap').addEventListener('click', function () { imp.swap = !imp.swap; renderPreview(); });
    $('#btnOther').addEventListener('click', function () { importDialog(); });
    dlg.querySelectorAll('input[name=mode]').forEach(function (r) {
      r.addEventListener('change', function () { imp.mode = r.value; renderPreview(); });
    });
    $('#btnDoImport').addEventListener('click', function () {
      var btn = this;
      busy(btn, true, 'Import en cours…');
      api('importParticipants', state.sel, ok.map(function (r) { return { prenom: r.prenom, nom: r.nom, email: r.email }; }), imp.mode)
        .then(function (res) {
          closeDialog();
          toast(plural(res.ajoutes, 'participant importé', 'participants importés'));
          state.imp = null; state.q = ''; state.picked = {};
          return refreshAll();
        }).catch(function (err) { busy(btn, false); showErr($('#errImp'), err.message); });
    });
  }

  // ================= Mode démonstration (hors Google) =================
  var Demo = (function () {
    var TRAITS = ['Bonne expression', 'Perspicace', 'Confiant en soi', 'Plein d’assurance', 'Persévérant', 'Déterminé', 'De confiance', 'Fiable', 'Aimable', 'Ouvert'];
    function wait(v, ms) { return new Promise(function (r) { setTimeout(function () { r(JSON.parse(JSON.stringify(v))); }, ms || 200); }); }
    function fail(m) { return new Promise(function (_, rej) { setTimeout(function () { rej(new Error(m)); }, 200); }); }
    var seq = 0;
    function id() { seq++; return 'd' + Date.now().toString(36) + seq; }
    function rng(seed) { var h = 2166136261; for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); } return function () { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; }; }
    function clamp(v) { return Math.max(1, Math.min(5, v)); }
    function scores(p, bias) {
      var r = rng(p.email), base = [];
      for (var k = 0; k < 10; k++) base.push(3 + r() * 1.7);
      p.self = p.auto ? base.map(function (v) { return clamp(Math.round(v + bias + (r() - .5))); }) : null;
      p.peer = p.recues ? base.map(function (v) { return clamp(Math.round((v + (r() - .5) * .9) * 4) / 4); }) : null;
    }
    var U = [
      { id: 'u-msc-a', nom: 'MSc Leadership, groupe A, septembre 2026', cree: '2026-09-14T08:00:00Z', code: '4827', acces: true },
      { id: 'u-emba', nom: 'Executive MBA, atelier du 14 octobre', cree: '2026-09-21T08:00:00Z', code: '3915', acces: false }
    ];
    var names = [['Alice', 'MARTIN'], ['Bruno', 'PETIT'], ['Chloé', 'DURAND'], ['David', 'LEROY'], ['Emma', 'MOREAU'],
      ['Farid', 'BENALI'], ['Gaëlle', 'ROUX'], ['Hugo', 'FOURNIER'], ['Inès', 'GIRARD'], ['Jules', 'BONNET'],
      ['Karim', 'HADDAD'], ['Léa', 'LAMBERT'], ['Mathis', 'FAURE'], ['Nora', 'CHEVALIER']];
    var rec = [4, 7, 3, 6, 5, 6, 3, 0, 7, 7, 6, 5, 6, 2];
    var bias = [1.0, -0.8, 0.1, 0.0, 0.6, -0.3, 0.9, -0.5, 0.2, 0.0, -1.0, 0.4, 0.1, -0.2];
    var P = names.map(function (n, i) {
      var p = { u: 'u-msc-a', id: 'p' + i, prenom: n[0], nom: n[1],
        email: n[0].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase() + '.' + n[1].toLowerCase() + '@exemple.fr',
        auto: i % 5 !== 3, recues: rec[i], ferme: i < 3, envoye: i < 2, dateEnvoi: i < 2 ? '2026-09-24T10:00:00Z' : '' };
      scores(p, bias[i]);
      return p;
    });
    function counts(u) {
      var ps = P.filter(function (p) { return p.u === u.id; });
      return { id: u.id, nom: u.nom, cree: u.cree, code: u.code, acces: u.acces, nParticipants: ps.length,
        nAuto: ps.filter(function (p) { return p.auto; }).length, nPairs: ps.reduce(function (s, p) { return s + p.recues; }, 0),
        nFermes: ps.filter(function (p) { return p.ferme; }).length, nEnvoyes: ps.filter(function (p) { return p.envoye; }).length };
    }
    function clean(nom, except) {
      nom = String(nom || '').trim().replace(/\s+/g, ' ');
      if (!nom) return { err: 'Donnez un nom à l’univers.' };
      if (U.some(function (u) { return u.id !== except && u.nom.toLowerCase() === nom.toLowerCase(); })) return { err: 'Un univers porte déjà ce nom. Choisissez un autre nom.' };
      return { nom: nom };
    }
    function mean(a) { return a.reduce(function (s, x) { return s + x; }, 0) / a.length; }
    function results(uid, pid) {
      var ps = P.filter(function (p) { return p.u === uid; }), me = ps.filter(function (p) { return p.id === pid; })[0];
      var withPeer = ps.filter(function (p) { return p.peer; }), withSelf = ps.filter(function (p) { return p.self; });
      var col = function (list, key) { return list.length ? TRAITS.map(function (_, k) { return mean(list.map(function (p) { return p[key][k]; })); }) : null; };
      var group = col(withPeer, 'peer'), gSelf = col(withSelf, 'self');
      var diffs = withPeer.filter(function (p) { return p.self; }).map(function (p) { return mean(p.self) - mean(p.peer); });
      var md = diffs.length ? mean(diffs) : 0, sd = diffs.length > 1 ? Math.sqrt(diffs.reduce(function (s, d) { return s + (d - md) * (d - md); }, 0) / (diffs.length - 1)) : 0;
      var pg = withPeer.map(function (p) { return mean(p.peer); }).sort(function (a, b) { return a - b; });
      var med = pg.length ? (pg.length % 2 ? pg[(pg.length - 1) / 2] : (pg[pg.length / 2 - 1] + pg[pg.length / 2]) / 2) : null;
      var r = { traits: TRAITS, self: me.self, peer: me.peer, group: group, n: me.recues,
        selfG: me.self ? mean(me.self) : null, peerG: me.peer ? mean(me.peer) : null, groupG: group ? mean(group) : null,
        D: null, type: null, typeTitre: null, johari: null, reference: 'moyenne du groupe', nGroupe: withPeer.length };
      if (me.self && me.peer) {
        r.D = r.selfG - r.peerG;
        var tau = 0.5 * sd;
        r.type = r.D > tau && r.D > 0 ? 'sur' : (r.D < -tau && r.D < 0 ? 'sous' : (r.peerG >= med ? 'accord_fav' : 'accord_dev'));
        r.typeTitre = { sur: 'Sur-estimateur', sous: 'Sous-estimateur', accord_fav: 'En accord, favorable', accord_dev: 'En accord, à développer' }[r.type];
        r.johari = { ouverte: [], insoup: [], angle: [], dev: [] };
        TRAITS.forEach(function (t, k) {
          var sH = me.self[k] >= gSelf[k], pH = me.peer[k] >= group[k];
          r.johari[sH && pH ? 'ouverte' : (!sH && pH ? 'insoup' : (sH && !pH ? 'angle' : 'dev'))].push(t);
        });
      }
      return r;
    }
    var api = {
      listUniverses: function () { return wait(U.slice().sort(function (a, b) { return a.cree < b.cree ? 1 : -1; }).map(counts)); },
      createUniverse: function (nom) {
        var c = clean(nom); if (c.err) return fail(c.err);
        var code = ('000' + Math.floor(Math.random() * 10000)).slice(-4);
        var u = { id: id(), nom: c.nom, cree: new Date().toISOString(), code: code, acces: true }; U.push(u); return wait(counts(u));
      },
      renameUniverse: function (uid, nom) {
        var c = clean(nom, uid); if (c.err) return fail(c.err);
        U.forEach(function (u) { if (u.id === uid) u.nom = c.nom; }); return wait({ ok: true });
      },
      deleteUniverse: function (uid) {
        U = U.filter(function (u) { return u.id !== uid; }); P = P.filter(function (p) { return p.u !== uid; }); return wait({ ok: true });
      },
      getParticipants: function (uid) {
        return wait(P.filter(function (p) { return p.u === uid; }).map(function (p) {
          return { id: p.id, prenom: p.prenom, nom: p.nom, email: p.email, auto: p.auto, recues: p.recues,
            envoye: p.envoye, dateEnvoi: p.dateEnvoi, ferme: p.ferme, aRapport: p.envoye };
        }));
      },
      importParticipants: function (uid, rows, mode) {
        if (mode === 'replace') P = P.filter(function (p) { return p.u !== uid; });
        var seen = {}; P.forEach(function (p) { if (p.u === uid) seen[p.email] = true; });
        var n = 0, ign = 0;
        rows.forEach(function (r) {
          var e = fmtEmail(r.email), pr = fmtPrenom(r.prenom), no = fmtNom(r.nom);
          if (!pr || !no || !EMAIL_RE.test(e) || seen[e]) { ign++; return; }
          seen[e] = true; n++;
          P.push({ u: uid, id: id(), prenom: pr, nom: no, email: e, auto: false, recues: 0, ferme: false, envoye: false, dateEnvoi: '', self: null, peer: null });
        });
        return wait({ ajoutes: n, ignores: ign });
      },
      addParticipant: function (uid, p) {
        var e = fmtEmail(p.email);
        if (P.some(function (x) { return x.u === uid && x.email === e; })) return fail('Cette adresse email est déjà inscrite dans cet univers.');
        return api.importParticipants(uid, [p], 'append');
      },
      removeParticipant: function (uid, pid) { P = P.filter(function (p) { return !(p.u === uid && p.id === pid); }); return wait({ ok: true }); },
      setAccess: function (uid, open) { U.forEach(function (u) { if (u.id === uid) u.acces = !!open; }); return wait({ acces: !!open }); },
      setClosed: function (uid, pids, closed) {
        var n = 0;
        P.forEach(function (p) { if (p.u === uid && (pids === 'ALL' || pids.indexOf(p.id) !== -1)) { p.ferme = !!closed; n++; } });
        return wait({ n: n });
      },
      getResults: function (uid, pid) {
        var me = P.filter(function (p) { return p.u === uid && p.id === pid; })[0];
        if (!me) return fail('Ce participant n’existe plus. Rafraîchissez la page.');
        var r = results(uid, pid);
        r.envoye = me.envoye; r.dateEnvoi = me.dateEnvoi; r.ferme = me.ferme; r.aRapport = me.envoye;
        return wait(r, 300);
      },
      previewReport: function () { return wait({ url: null }, 500); },
      reportUrl: function () { return wait({ url: null }, 300); },
      sendReports: function (uid, pids) {
        var now = new Date().toISOString();
        var res = pids.map(function (pid) {
          var p = P.filter(function (x) { return x.u === uid && x.id === pid; })[0];
          if (!p) return { pid: pid, ok: false, reason: 'Participant introuvable' };
          if (!p.recues) return { pid: pid, nom: p.prenom + ' ' + p.nom, ok: false, reason: 'Aucune évaluation reçue' };
          p.envoye = true; p.ferme = true; p.dateEnvoi = now;
          return { pid: pid, nom: p.prenom + ' ' + p.nom, ok: true };
        });
        return wait(res, 700);
      }
    };
    return api;
  })();

  // ================= Connexion (version GitHub) =================
  function readStored() {
    try { return sessionStorage.getItem(STORE) || localStorage.getItem(STORE) || ''; } catch (e) { return ''; }
  }
  function store(pw, remember) {
    try {
      clearStored();
      (remember ? localStorage : sessionStorage).setItem(STORE, pw);
    } catch (e) { /* stockage indisponible : la session durera le temps de l’onglet */ }
  }
  function clearStored() {
    try { sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); } catch (e) { }
  }
  function showLogin(msg, blocked) {
    if (dlg.open) dlg.close();
    if (sheet.open) sheet.close();
    state = { universes: [], sel: null, participants: [], loadingP: false, q: '', imp: null, picked: {}, sheetPid: null, sending: false, sort: state.sort };
    $('.app').hidden = true;
    $('#main').innerHTML = '';
    $('#uList').innerHTML = '';
    var box = $('#login');
    box.hidden = false;
    var err = $('#loginErr');
    err.textContent = msg || '';
    err.hidden = !msg;
    $('#loginPw').value = '';
    $('#loginPw').disabled = !!blocked;
    $('#loginBtn').disabled = !!blocked;
    if (!blocked) $('#loginPw').focus();
  }
  function hideLogin() {
    $('#login').hidden = true;
    $('.app').hidden = false;
  }
  function authLost() {
    KEY = '';
    clearStored();
    showLogin('Votre session a expiré ou le mot de passe a été modifié. Reconnectez-vous.');
  }

  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('#loginPw').value, btn = $('#loginBtn'), err = $('#loginErr');
    if (!pw) { err.textContent = 'Saisissez le mot de passe.'; err.hidden = false; return; }
    busy(btn, true, 'Connexion…');
    err.hidden = true;
    KEY = pw;
    api('login').then(function () {
      busy(btn, false);
      store(pw, $('#loginRemember').checked);
      hideLogin();
      loadUniverses();
    }).catch(function (x) {
      KEY = '';
      busy(btn, false);
      err.textContent = x.message;
      err.hidden = false;
      $('#loginPw').select();
    });
  });

  $('#btnLogout').addEventListener('click', function () {
    KEY = '';
    clearStored();
    showLogin('Vous êtes déconnecté.');
  });

  // ================= Démarrage =================
  (function start() {
    if (MODE !== 'http') { loadUniverses(); return; }
    $('#btnLogout').hidden = false;
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec\/?$/.test(API_URL)) {
      showLogin('L’adresse du serveur n’est pas configurée. Ouvrez le fichier config.js (dossier traits) et collez-y l’URL de votre application Web Apps Script.', true);
      return;
    }
    var saved = readStored();
    if (!saved) { showLogin(); return; }
    KEY = saved;
    $('.app').hidden = true;
    api('login').then(function () { hideLogin(); loadUniverses(); })
      .catch(function (x) { KEY = ''; clearStored(); showLogin(x.auth ? '' : x.message); });
  })();
})();
</script>
