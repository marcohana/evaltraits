<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traits du leader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root {
  --paper: #F2F4F7; --surface: #FFFFFF; --ink: #1B2230; --muted: #5E6878; --line: #DDE2E8; --line-strong: #C3CAD4;
  --accent: #12604F; --accent-hover: #0D4E40; --accent-ink: #FFFFFF; --accent-soft: #E0EEE9;
  --danger: #B3261E; --danger-soft: #FBEAE8; --warn: #85590A; --warn-soft: #FFF2D4;
  --font: 'Schibsted Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
  box-sizing: border-box; color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11151B; --surface: #181E26; --ink: #E6EAF0; --muted: #98A2B1; --line: #28303B; --line-strong: #39434F;
    --accent: #5BC2A5; --accent-hover: #7BD3BA; --accent-ink: #0B211B; --accent-soft: #1A352E;
    --danger: #F0857C; --danger-soft: #3A1E1C; --warn: #F2C46B; --warn-soft: #3A2E14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11151B; --surface: #181E26; --ink: #E6EAF0; --muted: #98A2B1; --line: #28303B; --line-strong: #39434F;
  --accent: #5BC2A5; --accent-hover: #7BD3BA; --accent-ink: #0B211B; --accent-soft: #1A352E;
  --danger: #F0857C; --danger-soft: #3A1E1C; --warn: #F2C46B; --warn-soft: #3A2E14; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.pin-show { font-size: 44px; font-weight: 700; letter-spacing: .3em; padding-left: .3em; margin: 0 0 14px; font-variant-numeric: tabular-nums; }
.pin-input { max-width: 180px; margin: 0 auto; display: block; }
.pin-field { max-width: 120px; text-align: center; font-size: 20px; font-weight: 700; letter-spacing: .3em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Barre du haut ---------- */
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top-inner { max-width: 680px; margin: 0 auto; padding: 0 16px; height: 60px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; margin-right: auto; }
/* ---------- Mise en page ---------- */
.wrap { max-width: 680px; margin: 0 auto; padding: 28px 16px 120px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
.center { text-align: center; }
h1 { font-size: 26px; line-height: 1.2; letter-spacing: -0.012em; margin: 16px 0 6px; }
h2 { font-size: 20px; line-height: 1.25; margin: 0 0 6px; }
.lead { color: var(--muted); margin: 0 0 22px; }
.note { font-size: 13.5px; color: var(--muted); margin: 14px 0 0; }

/* ---------- Sceau décagonal ---------- */
.seal-frame { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
.seal-ring { fill: none; stroke: var(--line); stroke-width: 1; }
.seal-shape { fill: var(--accent); stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; }
.seal-shape.is-empty { fill: none; stroke-dasharray: 3 3; }

/* ---------- Champs et boutons ---------- */
.field { display: block; margin-bottom: 14px; text-align: left; }
.field > span { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); font-size: 16px; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.code-input { text-align: center; font-size: 34px; font-weight: 700; letter-spacing: .4em; padding-left: calc(14px + .4em); height: 66px; font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 9px; border: 1px solid transparent; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); border-color: var(--line-strong); }
.btn-secondary:hover { background: var(--paper); }
.btn-link { background: none; border: 0; padding: 0; height: auto; color: var(--accent); font-weight: 600; font-size: 14.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.err { font-size: 14px; color: var(--danger); background: var(--danger-soft); padding: 10px 12px; border-radius: 8px; margin: 12px 0 0; text-align: left; }
.check-line { display: flex; gap: 10px; align-items: center; font-size: 14.5px; color: var(--muted); margin: 4px 0 16px; }
.check-line input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ---------- En-tête de session ---------- */
.session { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.session h1 { font-size: 20px; margin: 0; }
.session p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.me { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font-size: 14.5px; color: var(--muted); margin: -4px 0 18px; }
.me b { color: var(--ink); }

/* ---------- Choix du nom ---------- */
.names { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; max-height: 52vh; overflow-y: auto; }
.name-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 16px; }
.name-btn:hover { border-color: var(--line-strong); }
.name-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.name-btn .nom, .row-name .nom { font-weight: 700; }
.sticky-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.sticky-foot-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.sticky-foot .progress-text { font-size: 14px; color: var(--muted); margin-right: auto; }
.sticky-foot .btn { min-width: 150px; }

/* ---------- Sous-onglets ---------- */
.subtabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 4px; gap: 4px; margin-bottom: 18px; }
.subtab { border: 0; background: none; border-radius: 8px; padding: 10px 8px; font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; }
.subtab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.subtab small { font-weight: 500; }

/* ---------- Auto-évaluation : état ---------- */
.status-card { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.status-card .tag { font-size: 13px; font-weight: 700; padding: 3px 11px; border-radius: 999px; }
.tag.done { background: var(--accent-soft); color: var(--accent); }
.tag.todo { background: var(--warn-soft); color: var(--warn); }
.tag.closed { background: var(--paper); color: var(--muted); border: 1px solid var(--line-strong); }
.status-card p { margin: 0; }

/* ---------- Liste des camarades ---------- */
.search { margin-bottom: 12px; }
.peers { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.peer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: left; cursor: pointer; font-size: 16px; }
.peer:last-child { border-bottom: 0; }
.peer:hover:not(:disabled) { background: var(--paper); }
.peer:disabled { cursor: default; }
.peer .sub { display: block; font-size: 13px; color: var(--muted); }
.peer .state { font-size: 13px; font-weight: 600; white-space: nowrap; }
.peer .state.go { color: var(--accent); }
.peer .state.done { color: var(--accent); }
.peer .state.closed { color: var(--muted); font-weight: 500; }
.peer.is-done .row-name, .peer:disabled .row-name { color: var(--muted); }
.meter { display: inline-flex; gap: 2px; margin-left: 6px; vertical-align: middle; }
.meter i { width: 5px; height: 10px; border-radius: 1px; background: var(--line); }
.meter i.on { background: var(--accent); }
.hint-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }

/* ---------- Questionnaire ---------- */
.form-head { margin-bottom: 18px; }
.form-head h1 { font-size: 22px; margin: 6px 0 6px; }
.back { font-size: 14.5px; }
.scale-legend { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.25; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; margin-bottom: 14px; }

.trait { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 14px 12px; margin: 0 0 10px; }
.trait.is-missing { border-color: var(--danger); }
.trait legend { padding: 0; float: left; width: 100%; }
.trait .t-label { font-weight: 700; font-size: 16px; }
.trait .t-desc { display: block; font-size: 14px; color: var(--muted); margin-top: 1px; }
.trait .t-pos { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 2px; }
.choices { clear: both; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding-top: 12px; }
.choices label { position: relative; }
.choices input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choices span { display: flex; align-items: center; justify-content: center; height: 46px; border: 1px solid var(--line-strong); border-radius: 9px; font-weight: 700; font-size: 17px; background: var(--surface); transition: background .12s, border-color .12s; }
.choices input:checked + span { color: #fff; }
.choices label.v1 input:checked + span { background: #D7263D; border-color: #D7263D; }
.choices label.v2 input:checked + span { background: #EF5B2B; border-color: #EF5B2B; }
.choices label.v3 input:checked + span { background: #F5A623; border-color: #F5A623; color: #1B2230; }
.choices label.v4 input:checked + span { background: #7BC043; border-color: #7BC043; color: #1B2230; }
.choices label.v5 input:checked + span { background: #1E7B3C; border-color: #1E7B3C; }
.choices label.v1:hover span { border-color: #D7263D; } .choices label.v2:hover span { border-color: #EF5B2B; }
.choices label.v3:hover span { border-color: #F5A623; } .choices label.v4:hover span { border-color: #7BC043; }
.choices label.v5:hover span { border-color: #1E7B3C; }
.scale-legend b { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; margin: 0 auto 3px; color: #fff; font-size: 13px; }
.scale-legend .c1 b { background: #D7263D; } .scale-legend .c2 b { background: #EF5B2B; } .scale-legend .c3 b { background: #F5A623; color: #1B2230; }
.scale-legend .c4 b { background: #7BC043; color: #1B2230; } .scale-legend .c5 b { background: #1E7B3C; }
.choices input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.choice-text { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 19px; }
.choice-text b { color: var(--ink); }

/* ---------- Toast ---------- */
#toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 10px; font-size: 15px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 10; max-width: calc(100vw - 32px); text-align: center; }
#toast.is-on { opacity: 1; transform: translate(-50%, 0); }
#toast.is-error { background: var(--danger); color: #fff; }
.demo-banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 18px; }
.loading { color: var(--muted); text-align: center; padding: 40px 0; }

@media (max-width: 420px) {
  .brand span { display: none; }
  .card { padding: 22px 18px; }
  .choices span { height: 44px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><polygon class="seal-frame" points="50,6 75.9,14.4 91.8,36.4 91.8,63.6 75.9,85.6 50,94 24.1,85.6 8.2,63.6 8.2,36.4 24.1,14.4"/><polygon class="seal-shape" points="50,24 68,25 78,41 70,58 62,72 50,70 35,74 28,58 30,41 38,31"/></svg>
      <span>Traits du leader</span>
    </div>
  </div>
</header>
<main class="wrap" id="view" tabindex="-1"><p class="loading">Chargement…</p></main>
<div id="foot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ================= Connexion au serveur =================
  var API_URL = typeof window.TRAITS_API_URL === 'string' ? window.TRAITS_API_URL : '';
  var MODE = API_URL ? 'http' : 'demo';
  // Aperçu direct (démonstration uniquement) : window.TRAITS_PREVIEW = 'peer' ou 'self'
  var PREVIEW = MODE === 'demo' && (window.TRAITS_PREVIEW === 'peer' || window.TRAITS_PREVIEW === 'self') ? window.TRAITS_PREVIEW : null;
  var CONFIGURED = MODE === 'demo' || /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec\/?$/.test(API_URL);

  function call(action, args, key, attempt) {
    attempt = attempt || 0;
    if (MODE === 'demo') return Demo.run(action, args || [], key);
    return fetch(API_URL, {
      method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, args: args || [], key: key })
    }).then(function (r) {
      if (!r.ok) throw new Error('Le serveur a répondu par une erreur (' + r.status + '). Réessayez dans un instant.');
      return r.json();
    }, function () {
      throw new Error('Impossible de joindre le serveur. Vérifiez votre connexion internet.');
    }).then(function (res) {
      if (res.ok) return res.data;
      if (res.retry && attempt < 2) {
        return new Promise(function (r) { setTimeout(r, 1500 + attempt * 1500); }).then(function () { return call(action, args, key, attempt + 1); });
      }
      var e = new Error(res.error || 'Erreur inconnue.'); e.auth = !!res.auth; throw e;
    });
  }

  // ================= Outils =================
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function norm(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
  function plural(n, w, pl) { return n + ' ' + (n > 1 ? (pl || w + 's') : w); }
  function normCode(c) { return String(c == null ? '' : c).replace(/\D/g, ''); }
  function pretty(c) { return normCode(c); }
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  function del(k) { try { localStorage.removeItem(k); } catch (e) { } }
  function fullName(p) { return p.prenom + ' ' + p.nom; }

  function seal(id, size, filled) {
    var h = 2166136261;
    for (var i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
    function rnd() { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; }
    function pts(radius) {
      var out = [];
      for (var k = 0; k < 10; k++) {
        var a = -Math.PI / 2 + k * Math.PI / 5, r = typeof radius === 'function' ? radius() : radius;
        out.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1));
      }
      return out.join(' ');
    }
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100" aria-hidden="true">' +
      '<polygon class="seal-frame" points="' + pts(44) + '"/><polygon class="seal-ring" points="' + pts(26) + '"/>' +
      '<polygon class="seal-shape' + (filled ? '' : ' is-empty') + '" points="' + pts(function () { return 17 + rnd() * 26; }) + '"/></svg>';
  }

  var toastTimer;
  function toast(msg, isError) {
    var t = $('#toast');
    t.textContent = msg; t.className = 'is-on' + (isError ? ' is-error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ''; }, isError ? 5200 : 2800);
  }
  function busy(btn, on, label) {
    if (!btn) return;
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = label || 'Un instant…'; btn.disabled = true; }
    else { btn.textContent = btn.dataset.label || btn.textContent; btn.disabled = false; }
  }
  function showErr(el, msg) { if (!el) return toast(msg, true); el.textContent = msg; el.hidden = !msg; }

  var SCALE = ['Pas du tout d’accord', 'Pas d’accord', 'Neutre', 'D’accord', 'Totalement d’accord'];

  // ================= État =================
  var S = { code: '', session: null, me: null, sub: 'self', q: '', form: null, timer: null, reg: null, regMode: false, pinFor: null };
  var view = $('#view'), foot = $('#foot');
  function K(what) { return 'traits_' + what + '_' + normCode(S.code); }
  function doneSet() { try { return JSON.parse(get(K('done')) || '[]'); } catch (e) { return []; } }
  function markDone(pid) { var d = doneSet(); if (d.indexOf(pid) === -1) d.push(pid); put(K('done'), JSON.stringify(d)); }
  function token() {
    var t = get(K('tok'));
    if (!t) {
      var a = new Uint8Array(16);
      (window.crypto || window.msCrypto).getRandomValues(a);
      t = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      put(K('tok'), t);
    }
    return t;
  }
  function meP() { return S.session && S.session.participants.filter(function (p) { return p.id === S.me; })[0]; }

  function render() {
    clearInterval(S.timer); S.timer = null;
    foot.innerHTML = '';
    var banner = MODE !== 'demo' ? '' : (PREVIEW
      ? '<div class="demo-banner">Aperçu de l’écran de notation, avec des données fictives. Rien n’est enregistré.</div>'
      : '<div class="demo-banner">Mode démonstration : données fictives, rien n’est enregistré. Code à essayer : 4827. Emma MOREAU a le mot de passe 47.</div>');
    if (!CONFIGURED) {
      view.innerHTML = '<div class="card center"><h1>Page en cours d’installation</h1><p class="lead">L’adresse du serveur n’est pas encore configurée. Animateur : ouvrez le fichier config.js et collez-y l’URL de votre application Web Apps Script.</p></div>';
      return;
    }
    if (S.reg) return S.reg.done ? renderRegDone(banner) : renderRegForm(banner);
    if (!S.session) return renderCode(banner);
    if (S.pinFor) return renderPin(banner);
    if (!meP()) return renderWho(banner);
    if (meP().hasPin && !get(K('pin'))) { S.pinFor = S.me; S.me = null; return renderPin(banner); }
    if (S.form) return renderForm(banner);
    return renderHome(banner);
  }

  // ================= 1. Code de session =================
  function renderCode(banner, err) {
    var last = S.regMode ? '' : pretty(get('traits_code') || '');
    view.innerHTML = banner + '<form class="card center" id="fCode" novalidate>' + seal('rejoindre', 64, false) +
      (S.regMode ? '<h1>S’inscrire à une session</h1><p class="lead">Saisissez le code d’inscription affiché par votre enseignant.</p>'
                 : '<h1>Rejoindre une session</h1><p class="lead">Saisissez le code affiché par votre enseignant.</p>') +
      '<label class="field"><span class="sr">Code de session à 4 chiffres</span><input class="input code-input" id="inCode" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="0000" value="' + esc(last) + '"></label>' +
      '<button type="submit" class="btn btn-primary btn-block" id="btnCode">' + (S.regMode ? 'Continuer' : 'Rejoindre la session') + '</button>' +
      '<p class="err" id="errCode"' + (err ? '' : ' hidden') + '>' + esc(err || '') + '</p>' +
      '<p class="note">' + (S.regMode ? 'Déjà inscrit(e) ? <button type="button" class="btn-link" id="btnMode">Rejoindre une session</button>'
                                      : 'Votre enseignant vous a demandé de vous inscrire ? <button type="button" class="btn-link" id="btnMode">S’inscrire</button>') + '</p></form>';
    var inp = $('#inCode');
    inp.addEventListener('input', function () {
      inp.value = normCode(inp.value).slice(0, 4);
      if (inp.value.length === 4) go(inp.value);
    });
    function go(c) { if (S.regMode) openReg(c, $('#btnCode')); else join(c, $('#btnCode')); }
    $('#btnMode').addEventListener('click', function () { S.regMode = !S.regMode; render(); });
    $('#fCode').addEventListener('submit', function (e) {
      e.preventDefault();
      var c = normCode(inp.value);
      if (c.length !== 4) return showErr($('#errCode'), 'Le code comporte 4 chiffres, par exemple 4827.');
      go(c);
    });
    if (!last) inp.focus();
  }

  function join(code, btn) {
    if (S.joining) return Promise.resolve();
    S.joining = true;
    busy(btn, true, 'Connexion…');
    return call('session', [code]).then(function (sess) {
      S.joining = false;
      S.code = normCode(code); S.session = sess;
      put('traits_code', S.code);
      var saved = get(K('me'));
      S.me = sess.participants.some(function (p) { return p.id === saved; }) ? saved : null;
      S.sub = 'self';
      var me = meP();
      if (me && me.auto) S.sub = 'peers';
      render();
    }).catch(function (e) {
      S.joining = false;
      busy(btn, false);
      if (btn) showErr($('#errCode'), e.message); else { S.session = null; S.regMode = false; renderCode('', e.message); }
    });
  }

  function refreshSession() {
    return call('session', [S.code]).then(function (sess) { S.session = sess; return sess; });
  }

  function sessionHead() {
    var s = S.session;
    return '<div class="session">' + seal(s.id, 52, true) + '<div><h1>' + esc(s.nom) + '</h1><p>Session ' + esc(s.code) + '</p></div></div>';
  }

  // ================= 2. Qui êtes-vous ? =================
  function renderWho(banner) {
    var pick = S.pick || null;
    var list = S.session.participants.slice().sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr') || a.prenom.localeCompare(b.prenom, 'fr'); });
    view.innerHTML = banner + sessionHead() + '<div class="card"><h2>Qui êtes-vous ?</h2>' +
      '<p class="lead" style="margin-bottom:14px">Votre nom sert à enregistrer votre auto-évaluation et à vous retirer de la liste des personnes à évaluer. Vos évaluations de camarades restent anonymes.</p>' +
      '<input class="input" id="qWho" type="search" placeholder="Rechercher votre nom" aria-label="Rechercher votre nom" autocomplete="off">' +
      '<div class="names" id="names" role="list"></div>' +
      '<p class="note">Ce n’est pas la bonne session ? <button type="button" class="btn-link" id="btnLeave">Changer de code</button></p></div>';
    function paint() {
      var q = norm($('#qWho').value);
      var rows = list.filter(function (p) { return !q || norm(fullName(p)).indexOf(q) !== -1; });
      $('#names').innerHTML = rows.length ? rows.map(function (p) {
        return '<button type="button" role="listitem" class="name-btn" data-pid="' + esc(p.id) + '" aria-pressed="' + (pick === p.id) + '"><span>' + esc(p.prenom) + ' <span class="nom">' + esc(p.nom) + '</span></span></button>';
      }).join('') : '<p class="empty">Aucun nom ne correspond. Vérifiez l’orthographe, ou demandez à votre enseignant de vous ajouter.</p>';
    }
    paint();
    $('#qWho').addEventListener('input', paint);
    $('#names').addEventListener('click', function (e) {
      var b = e.target.closest('.name-btn'); if (!b) return;
      pick = S.pick = b.dataset.pid; paint(); paintFoot();
    });
    $('#btnLeave').addEventListener('click', leave);
    function paintFoot() {
      var p = S.session.participants.filter(function (x) { return x.id === pick; })[0];
      foot.innerHTML = p ? '<div class="sticky-foot"><div class="sticky-foot-inner"><button type="button" class="btn btn-primary btn-block" id="btnMe">Continuer en tant que ' + esc(fullName(p)) + '</button></div></div>' : '';
      if (p) $('#btnMe').addEventListener('click', function () {
        S.pick = null;
        if (p.hasPin) { S.pinFor = p.id; render(); window.scrollTo(0, 0); return; }
        S.me = p.id; put(K('me'), p.id);
        S.sub = p.auto ? 'peers' : 'self';
        render(); window.scrollTo(0, 0);
      });
    }
    paintFoot();
  }

  function leave() {
    S.session = null; S.me = null; S.form = null; S.pick = null; del('traits_code');
    render();
  }

  // ================= Mot de passe à 2 chiffres =================
  function renderPin(banner) {
    var p = S.session.participants.filter(function (x) { return x.id === S.pinFor; })[0];
    if (!p) { S.pinFor = null; return render(); }
    view.innerHTML = banner + sessionHead() + '<form class="card center" id="fPin" novalidate>' +
      '<h2>Bonjour ' + esc(p.prenom) + '</h2><p class="lead">Saisissez le mot de passe à 2 chiffres que vous avez choisi à l’inscription.</p>' +
      '<label class="field"><span class="sr">Mot de passe à 2 chiffres</span><input class="input code-input pin-input" id="inPin" type="password" maxlength="2" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="••"></label>' +
      '<button type="submit" class="btn btn-primary btn-block" id="btnPin">Valider</button>' +
      '<p class="err" id="errPin" hidden></p>' +
      '<p class="note">Mot de passe oublié ? Votre enseignant peut le retrouver. <button type="button" class="btn-link" id="btnNotPin">Ce n’est pas moi</button></p></form>';
    var inp = $('#inPin');
    inp.focus();
    function check() {
      var v = inp.value.replace(/\D/g, '');
      if (v.length !== 2) return showErr($('#errPin'), 'Le mot de passe comporte 2 chiffres.');
      if (S.checking) return;
      S.checking = true;
      busy($('#btnPin'), true, 'Vérification…');
      call('checkPin', [S.code, p.id, v]).then(function () {
        S.checking = false;
        S.me = p.id; S.pinFor = null; put(K('me'), p.id); put(K('pin'), v);
        S.sub = p.auto ? 'peers' : 'self';
        render(); window.scrollTo(0, 0);
      }).catch(function (e) {
        S.checking = false;
        busy($('#btnPin'), false);
        inp.value = ''; inp.focus();
        showErr($('#errPin'), e.message);
      });
    }
    inp.addEventListener('input', function () { inp.value = inp.value.replace(/\D/g, '').slice(0, 2); if (inp.value.length === 2) check(); });
    $('#fPin').addEventListener('submit', function (e) { e.preventDefault(); check(); });
    $('#btnNotPin').addEventListener('click', function () { S.pinFor = null; render(); });
  }

  // ================= Inscription =================
  function openReg(code, btn) {
    if (S.joining) return;
    S.joining = true;
    busy(btn, true, 'Vérification…');
    call('regInfo', [code]).then(function (info) {
      S.joining = false;
      S.reg = { code: normCode(code), info: info, done: null };
      render(); window.scrollTo(0, 0);
    }).catch(function (e) {
      S.joining = false;
      busy(btn, false);
      var el = $('#errCode');
      if (el) showErr(el, e.message); else { S.regMode = true; renderCode('', e.message); }
    });
  }

  function regHead() {
    var i = S.reg.info;
    return '<div class="session">' + seal(i.id, 52, true) + '<div><h1>' + esc(i.nom) + '</h1><p>Inscription à la session ' + esc(i.code) + '</p></div></div>';
  }

  function renderRegForm(banner) {
    view.innerHTML = banner + regHead() + '<form class="card" id="fReg" novalidate><h2>Inscription</h2>' +
      '<p class="lead" style="margin-bottom:18px">Ces informations permettent à votre enseignant de vous ajouter à la session et de vous envoyer votre rapport.</p>' +
      '<label class="field"><span>Prénom</span><input class="input" id="rPrenom" autocomplete="given-name" autocapitalize="words"></label>' +
      '<label class="field"><span>Nom</span><input class="input" id="rNom" autocomplete="family-name" autocapitalize="characters"></label>' +
      '<label class="field"><span>Email</span><input class="input" id="rEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"></label>' +
      '<label class="field"><span>Mot de passe à 2 chiffres</span><input class="input pin-field" id="rPin" maxlength="2" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="47"></label>' +
      '<p class="note" style="margin:-4px 0 18px">Choisissez 2 chiffres faciles à retenir. Ils vous seront demandés avant votre auto-évaluation, pour que personne d’autre ne puisse la faire à votre place.</p>' +
      '<button type="submit" class="btn btn-primary btn-block" id="btnReg">M’inscrire</button>' +
      '<p class="err" id="errReg" hidden></p>' +
      '<p class="note">Ce n’est pas la bonne session ? <button type="button" class="btn-link" id="btnRegBack">Changer de code</button></p></form>';
    var pin = $('#rPin');
    pin.addEventListener('input', function () { pin.value = pin.value.replace(/\D/g, '').slice(0, 2); });
    $('#btnRegBack').addEventListener('click', function () { S.reg = null; S.regMode = true; render(); });
    $('#fReg').addEventListener('submit', function (e) {
      e.preventDefault();
      var d = { prenom: $('#rPrenom').value.trim(), nom: $('#rNom').value.trim(), email: $('#rEmail').value.trim(), pin: pin.value };
      if (!d.prenom || !d.nom) return showErr($('#errReg'), 'Renseignez votre prénom et votre nom.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) return showErr($('#errReg'), 'L’adresse email n’est pas valide.');
      if (!/^\d{2}$/.test(d.pin)) return showErr($('#errReg'), 'Le mot de passe doit comporter exactement 2 chiffres.');
      var btn = $('#btnReg');
      busy(btn, true, 'Inscription…');
      call('register', [S.reg.code, d]).then(function (res) {
        S.reg.done = { prenom: res.prenom, pin: d.pin };
        render(); window.scrollTo(0, 0);
      }).catch(function (x) { busy(btn, false); showErr($('#errReg'), x.message); });
    });
    $('#rPrenom').focus();
  }

  function renderRegDone(banner) {
    var d = S.reg.done, c = S.reg.info.code;
    view.innerHTML = banner + regHead() + '<div class="card center">' +
      '<span class="tag done" style="display:inline-block">Inscription enregistrée</span>' +
      '<h2 style="margin-top:14px">Merci ' + esc(d.prenom) + ' !</h2>' +
      '<p class="lead" style="margin-bottom:14px">Votre mot de passe est</p><div class="pin-show">' + esc(d.pin) + '</div>' +
      '<p class="lead">Retenez-le : il vous sera demandé avant votre auto-évaluation. Votre enseignant va maintenant ajouter votre nom à la session. Vous pourrez ensuite la rejoindre avec le code <b>' + esc(c) + '</b>.</p>' +
      '<button type="button" class="btn btn-primary btn-block" id="btnJoinAfter">Rejoindre la session</button></div>';
    $('#btnJoinAfter').addEventListener('click', function () {
      var code = S.reg.code;
      S.reg = null; S.regMode = false;
      view.innerHTML = '<p class="loading">Connexion à la session…</p>';
      join(code, null);
    });
  }

  // ================= 3. Accueil de l'étudiant =================
  function renderHome(banner) {
    var me = meP(), others = S.session.participants.filter(function (p) { return p.id !== S.me; });
    var done = doneSet(), nDone = others.filter(function (p) { return done.indexOf(p.id) !== -1; }).length;
    view.innerHTML = banner + sessionHead() +
      '<p class="me">Vous êtes <b>' + esc(fullName(me)) + '</b>.<button type="button" class="btn-link" id="btnNotMe">Ce n’est pas vous ?</button></p>' +
      '<div class="subtabs" role="tablist" aria-label="Étapes">' +
      '<button class="subtab" role="tab" data-sub="self" aria-selected="' + (S.sub === 'self') + '">Mon auto-évaluation</button>' +
      '<button class="subtab" role="tab" data-sub="peers" aria-selected="' + (S.sub === 'peers') + '">Évaluer mes camarades <small class="num">(' + nDone + ')</small></button></div>' +
      '<div id="subview"></div>';
    $('#btnNotMe').addEventListener('click', function () { del(K('me')); del(K('pin')); S.me = null; render(); });
    view.querySelectorAll('.subtab').forEach(function (b) {
      b.addEventListener('click', function () { S.sub = b.dataset.sub; render(); });
    });
    if (S.sub === 'self') renderSelfStatus(me); else renderPeers(others, done);
  }

  function renderSelfStatus(me) {
    var sv = $('#subview'), h;
    if (me.ferme && me.auto) {
      h = '<span class="tag closed">Fermée</span><p>Votre auto-évaluation est enregistrée. Les évaluations sont maintenant fermées : elle ne peut plus être modifiée.</p>';
    } else if (me.ferme) {
      h = '<span class="tag closed">Fermée</span><p>Les évaluations sont fermées pour vous : l’auto-évaluation n’est plus possible. Adressez-vous à votre enseignant si besoin.</p>';
    } else if (me.auto) {
      h = '<span class="tag done">Enregistrée</span><p>Votre auto-évaluation est enregistrée. Vous pouvez la refaire tant que les évaluations sont ouvertes ; la nouvelle version remplacera l’ancienne.</p>' +
        '<button type="button" class="btn btn-secondary" id="btnSelf">Refaire mon auto-évaluation</button>' +
        '<button type="button" class="btn btn-primary" id="btnToPeers">Évaluer mes camarades</button>';
    } else {
      h = '<span class="tag todo">À faire</span><p>Pour chacun des 10 traits, indiquez dans quelle mesure il vous décrit, de 1 (pas du tout d’accord) à 5 (totalement d’accord). Comptez environ 3 minutes.</p>' +
        '<button type="button" class="btn btn-primary" id="btnSelf">Commencer mon auto-évaluation</button>';
    }
    sv.innerHTML = '<div class="card status-card">' + h + '</div>';
    var b = $('#btnSelf'); if (b) b.addEventListener('click', function () { openForm('self'); });
    var p = $('#btnToPeers'); if (p) p.addEventListener('click', function () { S.sub = 'peers'; render(); });
  }

  function renderPeers(others, done) {
    var sv = $('#subview');
    sv.innerHTML = '<div class="hint-box">Évaluez les camarades que vous connaissez suffisamment. Ceux qui ont reçu le moins d’évaluations apparaissent en premier. Vos réponses sont anonymes.</div>' +
      '<input class="input search" id="qPeer" type="search" placeholder="Rechercher un camarade" aria-label="Rechercher un camarade" autocomplete="off" value="' + esc(S.q) + '">' +
      '<div class="peers" id="peerList"></div><p class="note" id="peerNote"></p>';
    function paint() {
      var q = norm(S.q);
      var rank = function (p) { return p.ferme ? 2 : (done.indexOf(p.id) !== -1 ? 1 : 0); };
      var rows = others.filter(function (p) { return !q || norm(fullName(p)).indexOf(q) !== -1; })
        .sort(function (a, b) { return rank(a) - rank(b) || a.recues - b.recues || a.nom.localeCompare(b.nom, 'fr'); });
      var maxR = Math.max.apply(null, others.map(function (p) { return p.recues; }).concat([5]));
      $('#peerList').innerHTML = rows.length ? rows.map(function (p) {
        var isDone = done.indexOf(p.id) !== -1, bars = '';
        for (var i = 0; i < 5; i++) bars += '<i' + (p.recues >= Math.ceil((i + 1) * maxR / 5) ? ' class="on"' : '') + '></i>';
        var st = p.ferme ? '<span class="state closed">Fermé</span>' : (isDone ? '<span class="state done">Évalué</span>' : '<span class="state go">Évaluer</span>');
        return '<button type="button" class="peer' + (isDone ? ' is-done' : '') + '" data-pid="' + esc(p.id) + '"' + (p.ferme || isDone ? ' disabled' : '') + '>' +
          '<span><span class="row-name">' + esc(p.prenom) + ' <span class="nom">' + esc(p.nom) + '</span></span>' +
          '<span class="sub num">' + plural(p.recues, 'évaluation reçue', 'évaluations reçues') + '<span class="meter" aria-hidden="true">' + bars + '</span></span></span>' + st + '</button>';
      }).join('') : '<p class="empty">' + (others.length ? 'Aucun camarade ne correspond à votre recherche.' : 'Personne d’autre n’est inscrit dans cette session pour l’instant.') + '</p>';
      var nDone = others.filter(function (p) { return done.indexOf(p.id) !== -1; }).length;
      $('#peerNote').textContent = nDone ? 'Vous avez évalué ' + plural(nDone, 'camarade') + ' depuis cet appareil.' : '';
    }
    paint();
    $('#qPeer').addEventListener('input', function (e) { S.q = e.target.value; paint(); });
    $('#peerList').addEventListener('click', function (e) {
      var b = e.target.closest('.peer'); if (!b || b.disabled) return;
      openForm('peer', b.dataset.pid);
    });
    // Mise à jour des compteurs en direct
    S.timer = setInterval(function () {
      if (document.hidden || S.form || S.sub !== 'peers') return;
      refreshSession().then(function () {
        if (S.form || S.sub !== 'peers') return;
        others = S.session.participants.filter(function (p) { return p.id !== S.me; });
        paint();
      }).catch(function () { });
    }, 20000);
  }

  // ================= 4. Questionnaire =================
  function openForm(kind, pid) {
    S.form = { kind: kind, pid: pid || null, answers: {} };
    render(); window.scrollTo(0, 0);
    var h = $('.form-head h1'); if (h) h.focus();
  }

  function renderForm(banner) {
    var f = S.form, target = f.kind === 'peer' ? S.session.participants.filter(function (p) { return p.id === f.pid; })[0] : meP();
    var traits = S.session.traits;
    var title = f.kind === 'self' ? 'Mon auto-évaluation' : 'Évaluer ' + fullName(target);
    var intro = f.kind === 'self'
      ? 'Indiquez, pour chaque caractéristique, dans quelle mesure elle vous décrit.'
      : 'Indiquez, pour chaque caractéristique, dans quelle mesure elle décrit ' + target.prenom + '. Votre réponse est anonyme : ' + target.prenom + ' ne verra que la moyenne de toutes les évaluations reçues.';
    var h = banner + '<div class="form-head"><button type="button" class="btn-link back" id="btnBack">Revenir sans enregistrer</button>' +
      '<h1 tabindex="-1">' + esc(title) + '</h1><p class="lead" style="margin:0">' + esc(intro) + '</p></div>' +
      '<div class="scale-legend" aria-hidden="true">' + SCALE.map(function (t, i) { return '<span class="c' + (i + 1) + '"><b>' + (i + 1) + '</b><br>' + t + '</span>'; }).join('') + '</div>' +
      '<form id="fEval" novalidate>';
    traits.forEach(function (t, k) {
      var v = f.answers[t.key];
      h += '<fieldset class="trait" id="tr-' + t.key + '"><legend><span class="t-pos">' + (k + 1) + ' sur ' + traits.length + '</span>' +
        '<span class="t-label">' + esc(t.label) + '</span><span class="t-desc">' + esc(t.desc.charAt(0).toUpperCase() + t.desc.slice(1)) + '</span></legend>' +
        '<div class="choices">' + [1, 2, 3, 4, 5].map(function (n) {
          return '<label class="v' + n + '"><input type="radio" name="' + t.key + '" value="' + n + '"' + (v === n ? ' checked' : '') + ' aria-label="' + n + ' : ' + SCALE[n - 1] + '"><span>' + n + '</span></label>';
        }).join('') + '</div><div class="choice-text" id="ct-' + t.key + '">' + (v ? '<b>' + v + '</b> : ' + SCALE[v - 1] : '') + '</div></fieldset>';
    });
    h += '</form><p class="err" id="errEval" hidden></p>';
    view.innerHTML = h;
    foot.innerHTML = '<div class="sticky-foot"><div class="sticky-foot-inner"><span class="progress-text" id="prog"></span>' +
      '<button type="button" class="btn btn-primary" id="btnSend">Envoyer</button></div></div>';
    function progress() {
      var n = traits.filter(function (t) { return f.answers[t.key]; }).length;
      $('#prog').textContent = n + ' sur ' + traits.length + ' traits';
    }
    progress();
    $('#fEval').addEventListener('change', function (e) {
      if (e.target.type !== 'radio') return;
      var key = e.target.name, v = Number(e.target.value);
      f.answers[key] = v;
      $('#ct-' + key).innerHTML = '<b>' + v + '</b> : ' + SCALE[v - 1];
      $('#tr-' + key).classList.remove('is-missing');
      progress();
    });
    $('#btnBack').addEventListener('click', function () {
      var n = Object.keys(f.answers).length;
      if (n && !window.confirm('Revenir sans enregistrer ? Vos ' + n + ' réponses seront perdues.')) return;
      S.form = null; render(); window.scrollTo(0, 0);
    });
    $('#btnSend').addEventListener('click', function () {
      var missing = traits.filter(function (t) { return !f.answers[t.key]; });
      if (missing.length) {
        missing.forEach(function (t) { $('#tr-' + t.key).classList.add('is-missing'); });
        var first = $('#tr-' + missing[0].key);
        first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        var r = first.querySelector('input'); if (r) r.focus({ preventScroll: true });
        toast(missing.length === 1 ? 'Il reste un trait à noter : ' + missing[0].label + '.' : 'Il reste ' + missing.length + ' traits à noter.', true);
        return;
      }
      var btn = this;
      busy(btn, true, 'Envoi…');
      var p = f.kind === 'self' ? call('submitSelf', [S.code, S.me, f.answers, get(K('pin')) || '']) : call('submitPeer', [S.code, token(), f.pid, f.answers]);
      p.then(function () {
        if (f.kind === 'peer') { markDone(f.pid); toast('Évaluation de ' + fullName(target) + ' envoyée. Merci !'); }
        else toast('Auto-évaluation enregistrée. Merci !');
        S.form = null; S.sub = 'peers';
        return refreshSession().catch(function () { }).then(function () { render(); window.scrollTo(0, 0); });
      }).catch(function (e) {
        busy(btn, false);
        if (/déjà évalué/.test(e.message) && f.kind === 'peer') { markDone(f.pid); S.form = null; toast(e.message, true); render(); return; }
        if (/mot de passe/i.test(e.message) && f.kind === 'self') {
          del(K('pin')); S.pinFor = S.me; S.me = null; S.form = null;
          toast('Votre mot de passe doit être saisi de nouveau.', true); render(); return;
        }
        showErr($('#errEval'), e.message);
        $('#errEval').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
  }

  // ================= Démonstration (sans serveur) =================
  var Demo = (function () {
    var TRAITS = [['expression', 'Bonne expression', 'communique efficacement avec les autres'], ['perspicace', 'Perspicace', 'sait bien discerner'],
      ['confiance_soi', 'Confiant en soi', 'croit en lui et ses capacités'], ['assurance', 'Plein d’assurance', 'sûr de lui et ne doute pas'],
      ['perseverance', 'Persévérant', 'reste concentré sur ses objectifs malgré les interférences'], ['determination', 'Déterminé', 'garde sa ligne de conduite, agit avec certitude'],
      ['confiance', 'De confiance', 'inspire confiance et agit de manière crédible'], ['fiabilite', 'Fiable', 'sérieux et constant'],
      ['amabilite', 'Aimable', 'gentil et chaleureux'], ['ouverture', 'Ouvert', 'sociable, parle librement, s’entend bien avec les autres']]
      .map(function (t) { return { key: t[0], label: t[1], desc: t[2] }; });
    var names = [['Alice', 'MARTIN'], ['Bruno', 'PETIT'], ['Chloé', 'DURAND'], ['David', 'LEROY'], ['Emma', 'MOREAU'], ['Farid', 'BENALI'],
      ['Gaëlle', 'ROUX'], ['Hugo', 'FOURNIER'], ['Inès', 'GIRARD'], ['Jules', 'BONNET'], ['Karim', 'HADDAD'], ['Léa', 'LAMBERT']];
    var rec = [4, 7, 3, 6, 5, 6, 3, 0, 7, 7, 6, 2];
    var P = names.map(function (n, i) { return { id: 'p' + i, prenom: n[0], nom: n[1], recues: rec[i], auto: i % 4 !== 3, ferme: i === 2, hasPin: i === 4 || i === 11 }; });
    var PINS = { p4: '47', p11: '12' }, REG = [];
    var seen = {};
    function wait(v) { return new Promise(function (r) { setTimeout(function () { r(JSON.parse(JSON.stringify(v))); }, 250); }); }
    function fail(m) { return new Promise(function (_, j) { setTimeout(function () { j(new Error(m)); }, 250); }); }
    return { run: function (action, a, key) {
      if (normCode(a[0]) !== '4827') return fail('Code inconnu. Vérifiez le code affiché par votre enseignant.');
      if (action === 'regInfo') return wait({ id: 'u-msc-a', nom: 'MSc Leadership, groupe A', code: '4827' });
      if (action === 'register') {
        var em = String(a[1].email).toLowerCase();
        if (REG.indexOf(em) !== -1) return fail('Cette adresse email est déjà inscrite dans cette session. En cas d’erreur, adressez-vous à votre enseignant.');
        REG.push(em);
        return wait({ ok: true, prenom: a[1].prenom.charAt(0).toUpperCase() + a[1].prenom.slice(1).toLowerCase(), code: '4827' });
      }
      if (action === 'checkPin' || (action === 'submitSelf' && PINS[a[1]])) {
        var pid = a[1], given = action === 'checkPin' ? a[2] : a[3];
        if (PINS[pid] && given !== PINS[pid]) return fail('Mot de passe incorrect.');
        if (action === 'checkPin') return wait({ ok: true });
      }
      if (action === 'session') return wait({ id: 'u-msc-a', nom: 'MSc Leadership, groupe A', code: '4827', traits: TRAITS, participants: P });
      var p = P.filter(function (x) { return x.id === (action === 'submitSelf' ? a[1] : a[2]); })[0];
      if (!p) return fail('Participant introuvable.');
      if (p.ferme) return fail('Les évaluations de ' + p.prenom + ' ' + p.nom + ' sont fermées.');
      if (action === 'submitSelf') { p.auto = true; return wait({ ok: true }); }
      if (seen[a[1] + p.id]) return fail('Vous avez déjà évalué cette personne.');
      seen[a[1] + p.id] = true; p.recues++; return wait({ ok: true });
    } };
  })();

  // ================= Démarrage =================
  if (PREVIEW) {
    call('session', ['4827']).then(function (sess) {
      S.code = '4827'; S.session = sess; S.me = 'p4'; put(K('pin'), '47');
      S.sub = 'peers';
      S.form = { kind: PREVIEW, pid: PREVIEW === 'peer' ? 'p0' : null, answers: {} };
      render();
    });
    return;
  }
  var params = new URLSearchParams(window.location.search);
  var urlCode = normCode(params.get('code'));
  var regCode = normCode(params.get('inscription'));
  if (!CONFIGURED) { render(); return; }
  if (regCode.length === 4 || params.has('inscription')) {
    S.regMode = true;
    if (regCode.length === 4) { view.innerHTML = '<p class="loading">Ouverture de l’inscription…</p>'; openReg(regCode, null); }
    else render();
    return;
  }
  var start = urlCode.length === 4 ? urlCode : normCode(get('traits_code'));
  if (start.length === 4) {
    view.innerHTML = '<p class="loading">Connexion à la session…</p>';
    call('session', [start]).then(function (sess) {
      S.code = start; S.session = sess; put('traits_code', start);
      var saved = get(K('me'));
      S.me = sess.participants.some(function (p) { return p.id === saved; }) ? saved : null;
      var me = meP(); S.sub = me && me.auto ? 'peers' : 'self';
      render();
    }).catch(function (e) {
      if (!urlCode) { del('traits_code'); render(); return; }
      S.session = null; renderCode(MODE === 'demo' ? '<div class="demo-banner">Mode démonstration : code à essayer : 4827.</div>' : '', e.message);
    });
  } else {
    render();
  }
})();
</script>
</body>
</html>
